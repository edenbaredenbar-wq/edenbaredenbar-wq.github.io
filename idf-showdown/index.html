<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDF Unit Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one projector screen. Header (round + agenda + clock), a big stage in the middle, team scoreboard along the bottom.
   Look: a field briefing board. Dark olive ground, sand text, stencil display type, one amber "range flag" accent. */
:root {
  --ground: #161b11;
  --panel: #222a19;
  --panel-2: #2e3822;
  --line: #4a5636;
  --sand: #ece3c8;
  --khaki: #b8ad86;
  --flag: #f2b134;
  --flag-ink: #2a1d00;
  --good: #52d37e;
  --good-ink: #062b14;
  --bad: #ff5d50;
  --bad-ink: #300703;
  --shadow: rgba(0, 0, 0, 0.45);
  --font-display: "Black Ops One", "Stencil", "Arial Black", Impact, sans-serif;
  --font-head: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-he: "Arial Hebrew", "Noto Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
html { font-size: clamp(13px, 0.72vw + 0.55vh, 30px); height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--ground); color: var(--sand);
  font-family: var(--font-body), var(--emoji); line-height: 1.3;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
input { font: inherit; }
:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
[hidden] { display: none !important; }
.he { font-family: var(--font-he); direction: rtl; unicode-bidi: isolate; }

#app {
  height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0 3.9rem, rgba(236, 227, 200, 0.025) 3.9rem 4rem),
    repeating-linear-gradient(90deg, transparent 0 3.9rem, rgba(236, 227, 200, 0.025) 3.9rem 4rem),
    var(--ground);
}

/* ---------- Header ---------- */
#top {
  flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem;
  padding-block: 0.6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 2px solid var(--line); background: rgba(0, 0, 0, 0.28);
}
.brand { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 0.04em; color: var(--flag); white-space: nowrap; }
.agenda { display: flex; flex-wrap: wrap; gap: 0.35rem; flex: 1 1 auto; min-width: 0; }
.pill {
  font-family: var(--font-head); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 0.15rem 0.55rem; border-radius: 999px; border: 2px solid var(--line); color: var(--khaki); white-space: nowrap;
}
.pill.done { color: var(--line); text-decoration: line-through; }
.pill.now { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.clock {
  font-family: var(--font-head); font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums;
  padding: 0 0.6rem; border-radius: 0.5rem; background: var(--panel); border: 2px solid var(--line); white-space: nowrap;
}
.clock small { font-size: 0.6em; color: var(--khaki); font-weight: 600; }
.clock.late { border-color: var(--bad); color: var(--bad); }
.tools { display: flex; gap: 0.35rem; }
.tool {
  font-family: var(--font-head); font-weight: 700; font-size: 1rem; letter-spacing: 0.04em;
  background: var(--panel); border: 2px solid var(--line); border-radius: 0.5rem; padding: 0.25rem 0.6rem; color: var(--sand);
}
.tool:hover { border-color: var(--khaki); }

/* ---------- Stage ---------- */
#stage {
  flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  padding-block: 1.2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.center { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.3rem; text-align: center; }
.eyebrow { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--khaki); }
.display { font-family: var(--font-display); font-weight: 400; line-height: 1.02; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.h-xxl { font-size: clamp(2.6rem, 9vh, 7rem); }
.h-xl { font-size: clamp(2rem, 6.5vh, 5rem); }
.h-l { font-size: clamp(1.6rem, 4.6vh, 3.4rem); }
.lead { font-size: 1.55rem; max-width: 46ch; margin: 0; color: var(--sand); text-wrap: balance; }
.muted { color: var(--khaki); }
.q {
  font-family: var(--font-head); font-weight: 700; font-size: clamp(1.8rem, 5.6vh, 4.2rem); line-height: 1.1;
  margin: 0; max-width: 30ch; text-wrap: balance;
}

.btn {
  font-family: var(--font-head); font-weight: 800; font-size: 1.6rem; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 0.5rem 1.4rem; border-radius: 0.6rem; background: var(--panel-2); border: 2px solid var(--line);
  box-shadow: 0 0.3rem 0 var(--shadow); transition: transform 0.08s, filter 0.15s;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(0.2rem); box-shadow: 0 0.1rem 0 var(--shadow); }
.btn:disabled { opacity: 0.35; cursor: default; filter: none; transform: none; }
.btn.go { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.btn.ok { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.btn.no { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.btn.big { font-size: 2.2rem; padding: 0.55rem 2rem; }
.btn.small { font-size: 1.1rem; padding: 0.3rem 0.9rem; }
kbd {
  font: 700 0.62em/1 ui-monospace, Consolas, monospace; padding: 0.15em 0.4em; margin-left: 0.5em; border-radius: 0.3em;
  border: 1px solid currentColor; opacity: 0.75; vertical-align: 0.15em; text-transform: none;
}
.row { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; align-items: center; }

/* Team tag */
.tag {
  display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-head); font-weight: 800; font-size: 1.7rem;
  letter-spacing: 0.04em; text-transform: uppercase; padding: 0.25rem 1rem; border-radius: 0.5rem;
  background: var(--tc); color: #10140b;
}
.tag.steal { animation: pulse 0.9s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

/* Answer grid */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; width: min(100%, 72rem); }
.opt {
  display: flex; align-items: center; gap: 0.9rem; text-align: left; min-width: 0;
  font-family: var(--font-head); font-weight: 700; font-size: clamp(1.4rem, 3.6vh, 2.5rem); line-height: 1.1;
  padding: 0.65rem 1rem; border-radius: 0.7rem; background: var(--panel); border: 3px solid var(--line);
  transition: transform 0.1s, background 0.2s, border-color 0.2s, opacity 0.2s;
}
button.opt:hover:not(:disabled) { border-color: var(--flag); transform: translateY(-2px); }
.opt .key {
  flex: 0 0 auto; width: 2.1em; height: 2.1em; display: grid; place-items: center; border-radius: 0.4rem;
  background: var(--panel-2); font-family: var(--font-display); font-size: 0.85em; color: var(--flag);
}
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt.right { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.opt.right .key { background: rgba(0, 0, 0, 0.15); color: var(--good-ink); }
.opt.wrong { background: transparent; border-color: var(--bad); color: var(--bad); text-decoration: line-through; opacity: 0.75; }
.opt.dim { opacity: 0.35; }
.opt:disabled { cursor: default; }

/* Field note: the learning moment after every reveal */
.note {
  display: flex; gap: 1rem; align-items: flex-start; text-align: left; width: min(100%, 72rem);
  background: var(--sand); color: #1d2214; border-radius: 0.4rem; padding: 0.9rem 1.2rem;
  box-shadow: 0 0.4rem 0 var(--shadow); transform: rotate(-0.4deg); animation: drop 0.35s ease;
}
.note b.lbl {
  flex: 0 0 auto; font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; letter-spacing: 0.06em;
  background: #1d2214; color: var(--sand); padding: 0.25rem 0.55rem; border-radius: 0.25rem; margin-top: 0.15rem;
}
.note p { margin: 0; font-size: 1.55rem; font-weight: 500; min-width: 0; }
@keyframes drop { from { opacity: 0; transform: translateY(-12px) rotate(-0.4deg); } to { opacity: 1; transform: rotate(-0.4deg); } }

/* Timer bar */
.timer { width: min(100%, 72rem); height: 0.7rem; border-radius: 999px; background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
.timer i { display: block; height: 100%; background: var(--flag); transform-origin: left; }
.timer.low i { background: var(--bad); }
.timerNum { font-family: var(--font-head); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--khaki); }

/* Team picker buttons inside the stage */
.teamBtns { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; }
.teamBtn {
  font-family: var(--font-head); font-weight: 800; font-size: 1.5rem; padding: 0.45rem 1rem; border-radius: 0.6rem;
  border: 3px solid var(--tc); background: transparent; color: var(--sand); display: inline-flex; align-items: center; gap: 0.5rem;
}
.teamBtn .n { font-family: var(--font-display); font-weight: 400; color: var(--tc); }
.teamBtn.on { background: var(--tc); color: #10140b; }
.teamBtn.on .n { color: #10140b; }
.teamBtn.out { opacity: 0.35; text-decoration: line-through; border-style: dashed; }
.teamBtn:disabled { cursor: default; }

/* ---------- Setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; width: min(100%, 92rem); margin: auto; align-items: start; }
.setup h1 { margin: 0; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 0.8rem; padding: 1.1rem 1.3rem; display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.panel h3 { margin: 0; font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--khaki); }
.countRow { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.countRow button { font-family: var(--font-display); font-size: 1.5rem; width: 2.6rem; height: 2.6rem; border-radius: 0.5rem; background: var(--panel-2); border: 2px solid var(--line); }
.countRow button.on { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.names label { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.names .sw { flex: 0 0 auto; width: 1.1rem; height: 1.1rem; border-radius: 0.25rem; background: var(--tc); }
.names input {
  flex: 1 1 auto; min-width: 0; font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; color: var(--sand);
  background: var(--ground); border: 2px solid var(--line); border-radius: 0.4rem; padding: 0.3rem 0.5rem; user-select: text; -webkit-user-select: text;
}
.names input:focus { border-color: var(--tc); outline: none; }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
.plan li { display: grid; grid-template-columns: auto 1fr auto; gap: 0.7rem; align-items: center; font-size: 1.15rem; }
.plan input { width: 1.2rem; height: 1.2rem; accent-color: var(--flag); }
.plan b { font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; }
.plan .m { font-family: var(--font-head); color: var(--khaki); font-variant-numeric: tabular-nums; }
.hint { font-size: 1rem; color: var(--khaki); margin: 0; }

/* ---------- Briefing ---------- */
.slideNum { font-family: var(--font-head); color: var(--khaki); font-weight: 700; letter-spacing: 0.1em; }
.bigHe { font-family: var(--font-he); font-weight: 800; font-size: clamp(3rem, 12vh, 9rem); line-height: 1; color: var(--flag); }
.bigNum { font-family: var(--font-display); font-size: clamp(5rem, 22vh, 15rem); line-height: 0.9; color: var(--flag); }
.branches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; width: min(100%, 76rem); }
.branch { background: var(--panel); border: 2px solid var(--line); border-radius: 0.8rem; padding: 1.1rem; text-align: left; display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.branch .ico { font-family: var(--emoji); font-size: 2.6rem; line-height: 1; }
.branch h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--flag); }
.branch p { margin: 0; font-size: 1.25rem; }
.ladder { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; width: min(100%, 82rem); }
.rung { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.6rem 0.8rem; min-width: 7.5rem; background: var(--panel); border: 2px solid var(--line); border-radius: 0.6rem; }
.rung .chev { font-family: var(--font-display); color: var(--flag); font-size: 1.1rem; letter-spacing: -0.1em; min-height: 1.2em; }
.rung b { font-family: var(--font-head); font-size: 1.5rem; }
.rung span { font-size: 1rem; color: var(--khaki); }
.rung em { font-style: normal; font-family: var(--font-head); font-weight: 700; color: var(--sand); font-variant-numeric: tabular-nums; }

/* ---------- Round intro ---------- */
.introCard { width: min(100%, 64rem); display: flex; flex-direction: column; gap: 1rem; align-items: center; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; text-align: left; width: 100%; }
.rules li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.6rem; font-size: 1.55rem; align-items: baseline; }
.rules li::before { content: "▸"; color: var(--flag); font-family: var(--font-display); text-align: right; }
.score-line { font-family: var(--font-head); font-weight: 700; font-size: 1.5rem; color: var(--flag); letter-spacing: 0.04em; }

/* ---------- Beret ---------- */
.beretStage { display: grid; place-items: center; padding: 0.4rem 3rem; border-radius: 50%; background: radial-gradient(closest-side, rgba(236, 227, 200, 0.34), rgba(236, 227, 200, 0.08) 70%, transparent); max-width: 100%; }
.beret { height: min(28vh, 17rem); width: auto; max-width: 100%; filter: drop-shadow(0 0.6rem 0.4rem rgba(0,0,0,0.5)); animation: plop 0.5s cubic-bezier(.3,1.6,.5,1); }
@keyframes plop { from { transform: translateY(-30px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Real / Fake ---------- */
.rf { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: min(100%, 60rem); }
.rf div { border-radius: 0.8rem; padding: 0.9rem; border: 3px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; gap: 0.2rem; transition: all 0.25s; }
.rf .thumb { font-family: var(--emoji); font-size: 3.6rem; line-height: 1; }
.rf b { font-family: var(--font-display); font-weight: 400; font-size: 2.2rem; letter-spacing: 0.06em; }
.rf .right { background: var(--good); border-color: var(--good); color: var(--good-ink); transform: scale(1.04); }
.rf .wrong { opacity: 0.3; }
.statement { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.8rem, 5.4vh, 4rem); line-height: 1.12; margin: 0; max-width: 32ch; text-wrap: balance; }

/* ---------- Who am I ---------- */
.wai { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 22rem); gap: 1.5rem; width: min(100%, 90rem); margin: auto; align-items: start; }
.clues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
.clue {
  display: grid; grid-template-columns: 5.4rem 1fr; align-items: center; gap: 0.9rem; min-height: 4.4rem;
  background: var(--panel); border: 2px solid var(--line); border-radius: 0.7rem; padding: 0.6rem 1rem;
}
.clue .pts { font-family: var(--font-display); font-size: 1.6rem; color: var(--flag); text-align: center; }
.clue p { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: clamp(1.4rem, 3.4vh, 2.3rem); line-height: 1.12; min-width: 0; }
.clue.hidden { border-style: dashed; background: transparent; }
.clue.hidden p { color: var(--line); letter-spacing: 0.3em; font-family: var(--font-display); font-weight: 400; }
.clue.hidden .pts { color: var(--line); }
.clue.new { animation: drop 0.35s ease; }
.side { display: flex; flex-direction: column; gap: 0.9rem; align-items: stretch; text-align: center; }
.worth { background: var(--panel); border: 2px solid var(--flag); border-radius: 0.8rem; padding: 0.7rem; }
.worth b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 3.6rem; line-height: 1; color: var(--flag); }
.answerBox { background: var(--good); color: var(--good-ink); border-radius: 0.8rem; padding: 0.9rem 1.1rem; animation: plop 0.45s cubic-bezier(.3,1.6,.5,1); }
.answerBox .ico { font-family: var(--emoji); font-size: 3rem; line-height: 1; }
.answerBox h3 { margin: 0.2rem 0 0; font-family: var(--font-display); font-weight: 400; font-size: 2rem; line-height: 1.05; }

/* ---------- Commander says ---------- */
.cmd { width: min(100%, 70rem); background: var(--panel); border: 3px solid var(--line); border-radius: 1rem; padding: 1.4rem 1.6rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
.cmd.says { border-color: var(--flag); }
.cmd .prefix { font-family: var(--font-head); font-weight: 800; font-size: clamp(1.6rem, 4.5vh, 3rem); color: var(--flag); letter-spacing: 0.04em; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
.cmd .prefix.nope { color: var(--line); text-decoration: line-through; font-size: 1.4rem; }
.cmd .heb { font-family: var(--font-he); font-weight: 800; font-size: clamp(2.6rem, 9vh, 6.5rem); line-height: 1.05; direction: rtl; }
.cmd .tr { font-family: var(--font-display); font-size: clamp(2rem, 6vh, 4.4rem); line-height: 1.05; }
.cmd .en { font-size: 1.6rem; color: var(--khaki); }
.cmd.pop { animation: plop 0.35s cubic-bezier(.3,1.6,.5,1); }

/* ---------- End ---------- */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 1rem; width: min(100%, 70rem); }
.pod { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
.pod .nm { font-family: var(--font-head); font-weight: 800; font-size: 1.7rem; text-align: center; overflow-wrap: anywhere; }
.pod .rk { font-size: 1.1rem; color: var(--khaki); text-align: center; }
.pod .blk { width: 100%; border-radius: 0.6rem 0.6rem 0 0; background: var(--tc); color: #10140b; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 0.6rem; }
.pod .blk b { font-family: var(--font-display); font-weight: 400; font-size: 3rem; line-height: 1; }
.pod .blk span { font-family: var(--font-head); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.rest { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
.debrief { width: min(100%, 64rem); border: 2px dashed var(--flag); border-radius: 0.8rem; padding: 0.8rem 1.2rem; }
.debrief p { margin: 0.2rem 0 0; font-size: 1.6rem; font-family: var(--font-head); font-weight: 700; }

/* ---------- Scoreboard ---------- */
#board {
  flex: 0 0 auto; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 0.6rem;
  padding-block: 0.6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 2px solid var(--line); background: rgba(0, 0, 0, 0.35);
}
.team {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 0.4rem;
  align-items: center; background: var(--panel); border-radius: 0.6rem; padding: 0.45rem 0.6rem 0.45rem 1rem; min-width: 0;
  border: 2px solid transparent; overflow: hidden;
}
.team::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0.45rem; background: var(--tc); }
.team.active { border-color: var(--tc); box-shadow: 0 0 1.2rem -0.2rem var(--tc); }
.team .tn { grid-column: 1; font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .tn .num { font-family: var(--font-display); font-weight: 400; color: var(--tc); margin-right: 0.3rem; }
.team .tr { grid-column: 1; font-size: 0.95rem; color: var(--khaki); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .tr .chev { color: var(--flag); font-family: var(--font-display); }

/* ---------- Overlays ---------- */
#overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 5, 0.82); display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--panel); border: 2px solid var(--line); border-radius: 1rem; padding: 1.3rem 1.6rem; width: min(100%, 52rem); max-height: 90%; overflow: auto; display: flex; flex-direction: column; gap: 0.8rem; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--flag); font-size: 2rem; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1rem; font-size: 1.2rem; }
.keys kbd { margin: 0; opacity: 1; font-size: 0.9em; }
.jump { display: flex; flex-direction: column; gap: 0.4rem; }
.jump button { text-align: left; font-family: var(--font-head); font-weight: 700; font-size: 1.4rem; padding: 0.4rem 0.8rem; border-radius: 0.5rem; background: var(--panel-2); border: 2px solid var(--line); }
.jump button:hover { border-color: var(--flag); }
#toasts { position: fixed; z-index: 50; right: max(16px, env(safe-area-inset-right, 0px)); top: 4rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; pointer-events: none; width: min(calc(100vw - 32px), 26rem); }
.toast {
  font-family: var(--font-head); font-weight: 800; font-size: 1.35rem; text-align: right; padding: 0.45rem 1rem; border-radius: 0.6rem;
  background: var(--flag); color: var(--flag-ink); box-shadow: 0 0.5rem 1.4rem rgba(0,0,0,0.6); animation: toastIn 0.4s cubic-bezier(.3,1.6,.5,1);
}
.toast small { display: block; font-size: 0.7em; font-weight: 600; }
@keyframes toastIn { from { transform: translateY(-20px) scale(0.9); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; }

@media (max-width: 760px) {
  .setup, .wai { grid-template-columns: minmax(0, 1fr); }
  .opts, .branches { grid-template-columns: minmax(0, 1fr); }

  .names { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

/* Ranks — teams get promoted as they score. */
const RANKS = [
  { min: 0,    tr: "Tiron",     en: "Recruit",    chev: "" },
  { min: 200,  tr: "Turai",     en: "Private",    chev: "›" },
  { min: 500,  tr: "Rav-Turai", en: "Corporal",   chev: "››" },

  { min: 1800, tr: "Seren",     en: "Captain",    chev: "★★" },
  { min: 2300, tr: "Rav-Seren", en: "Major",      chev: "✦" },
  { min: 2800, tr: "Aluf",      en: "General",    chev: "✦✦" }
];

const ROUNDS = [
  { id: "briefing",  name: "Briefing",        mins: 2 },
  { id: "trivia",    name: "Boot Camp Trivia", mins: 8 },
  { id: "berets",    name: "Beret Lineup",    mins: 4 },
  { id: "whoami",    name: "Who Am I?",       mins: 6 },

  { id: "awards",    name: "Awards",          mins: 2 }
];
const INTRO = {
  trivia: { he: "טירונות", sub: "Tironut · basic training",
    rules: ["Teams take turns answering. The team on duty discusses, then its captain says A, B, C or D.",

const TEAM_COLORS = ["#ff8a3d", "#3fc5f0", "#f25c9a", "#9be15d", "#b18cff", "#2fe0c0"];

/* ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rankOf = (score) => { let r = 0; RANKS.forEach((k, i) => { if (score >= k.min) r = i; }); return r; };
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function freshState() {
  return {
    screen: "setup",           // setup | intro | play | end
    teamCount: 4,
    names: DEFAULT_NAMES.slice(),
    enabled: ROUNDS.map(() => true),
    teams: [],
    roundIdx: 0,
    deck: [], i: 0,
    turn: 0, phase: "", picks: [], actor: -1, chosen: [], locked: [], shown: 1,

}
let S = freshState();
let undoStack = [];
let timer = { end: 0, dur: 0, running: false, beeped: false };
let muted = false;

/* ---------- Sound (generated, no files) ---------- */
let ac = null;
function tone(freq, dur, type = "sine", vol = 0.18, when = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  ok: () => { tone(660, 0.15, "triangle"); tone(990, 0.3, "triangle", 0.18, 0.12); },
  no: () => { tone(160, 0.45, "square", 0.08); tone(120, 0.45, "square", 0.06, 0.05); },
  tick: () => tone(1200, 0.05, "square", 0.04),
  show: () => { tone(523, 0.12, "triangle"); tone(784, 0.25, "triangle", 0.2, 0.1); },
  bugle: () => { [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 5 ? 0.45 : 0.16, "triangle", 0.16, i * 0.15)); },
  fanfare: () => { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i === 7 ? 0.8 : 0.18, "sawtooth", 0.06, i * 0.17)); },

/* ---------- State changes (all undoable) ---------- */
function act(fn) {
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > 80) undoStack.shift();
  const before = S.teams.map((t) => t.score);
  fn();
  afterScore(before);
  render();
}
function undo() {
  if (!undoStack.length) return toast("Nothing to undo");
  S = JSON.parse(undoStack.pop());
  toast("Undone");
  render();
}
function afterScore(before) {
  S.teams.forEach((t, i) => {
    if (t.score === before[i]) return;
    t.bump = Date.now();
    const r0 = rankOf(before[i]), r1 = rankOf(t.score);
    if (r1 > r0) {
      const r = RANKS[r1];
      setTimeout(() => { toast(`${t.name} promoted to ${r.tr}!`, `${r.en} ${r.chev}`); SFX.bugle(); }, 500);
    }
  });
}
function addPoints(team, pts) { if (team >= 0 && S.teams[team]) S.teams[team].score += pts; }

/* ---------- Flow ---------- */
const round = () => ROUNDS[S.roundIdx];
function startGame() {
  readSetupInputs();
  S.teams = S.names.slice(0, S.teamCount).map((n, i) => ({ name: (n || "").trim() || DEFAULT_NAMES[i], color: TEAM_COLORS[i], score: 0 }));
  S.startedAt = Date.now();
  S.roundIdx = -1;
  nextRound();
}
function nextRound() {
  let k = S.roundIdx + 1;
  while (k < ROUNDS.length && !S.enabled[k]) k++;
  if (k >= ROUNDS.length) k = ROUNDS.length - 1;
  goRound(k);
}
function goRound(k) {
  S.roundIdx = k;
  S.i = 0; S.phase = ""; S.picks = []; S.actor = -1; S.chosen = []; S.locked = []; S.shown = 1; S.out = []; S.cmd = null; S.cmdN = 0; S.slide = 0;
  const id = round().id;
  const n = S.teams.length;
  if (id === "briefing") { S.screen = "play"; }
  else if (id === "awards") { S.screen = "end"; SFX.fanfare(); confetti(); }
  else {
    S.screen = "intro";
    if (id === "trivia") {
      const per = n <= 2 ? 4 : n <= 4 ? 3 : 2;
      S.deck = shuffle(CONTENT.trivia).slice(0, Math.min(CONTENT.trivia.length, per * n)).map(mcq);
      S.turn = 0;
    }
    if (id === "berets") S.deck = shuffle(CONTENT.berets).slice(0, BERETS_PER_GAME).map((b) => {
      const others = shuffle(CONTENT.berets.filter((x) => x.unit !== b.unit)).slice(0, 3).map((x) => x.unit);
      const opts = shuffle([b.unit, ...others]);
      return { ...b, opts, answer: opts.indexOf(b.unit) };
    });
    if (id === "whoami") S.deck = shuffle(CONTENT.whoami).slice(0, WHOAMI_PER_GAME);
    if (id === "realfake") S.deck = shuffle(CONTENT.realfake).slice(0, REALFAKE_PER_GAME);
  }
}
function mcq(item) {
  const opts = shuffle(item.opts);
  return { q: item.q, note: item.note, opts, answer: opts.indexOf(item.opts[0]) };
}
function beginRound() {
  S.screen = "play";
  setupQuestion();
}
function setupQuestion() {
  const id = round().id;
  S.picks = []; S.chosen = []; S.locked = []; S.shown = 1; S.actor = -1;
  if (id === "trivia") { S.phase = "ask"; startTimer(TRIVIA_SECONDS); }
  if (id === "berets" || id === "realfake") { S.phase = "ask"; startTimer(SHOW_SECONDS); }
  if (id === "whoami") { S.phase = "clue"; stopTimer(); }
  if (id === "commander") { S.phase = "ready"; S.out = []; S.cmd = null; S.cmdN = 0; stopTimer(); }
}
function nextQuestion() {
  S.i++;
  if (round().id === "trivia") S.turn = (S.turn + 1) % S.teams.length;
  if (S.i >= S.deck.length) { stopTimer(); nextRound(); return; }
  setupQuestion();
}

/* ---------- Timer ---------- */
function startTimer(sec) { timer = { end: Date.now() + sec * 1000, dur: sec * 1000, running: true, beeped: false, lastTick: -1 }; }
function stopTimer() { timer.running = false; }
function drawTimer() {
  const bar = $("#tbar"), num = $("#tnum");
  if (!bar) return;
  const left = timer.running ? Math.max(0, timer.end - Date.now()) : 0;
  const frac = timer.dur ? left / timer.dur : 0;
  bar.querySelector("i").style.transform = `scaleX(${frac})`;
  bar.classList.toggle("low", left < 5000);
  const secs = Math.ceil(left / 1000);
  if (num) num.textContent = timer.running ? (left > 0 ? `${secs}s` : (num.dataset.done || "Time!")) : "";
  if (timer.running && left > 0 && secs <= 3 && secs !== timer.lastTick) { timer.lastTick = secs; SFX.tick(); }
  if (timer.running && left <= 0 && !timer.beeped) {
    timer.beeped = true;
    if (num && num.dataset.done) SFX.show(); else SFX.no();
  }
}

function plannedEnd(idx) { let m = 0; for (let k = 0; k <= idx; k++) if (S.enabled[k]) m += ROUNDS[k].mins; return m; }
function totalMins() { return ROUNDS.reduce((m, r, k) => m + (S.enabled[k] ? r.mins : 0), 0); }

function renderEnd() {
  const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
  const place = (k) => order.filter((o) => o.score > order[k].score).length + 1;
  const top = order.slice(0, Math.min(3, order.length));
  const visual = top.length === 3 ? [top[1], top[0], top[2]] : top.length === 2 ? [top[1], top[0]] : top;
  const pod = visual.map((t) => {
    const k = order.indexOf(t), p = place(k), r = RANKS[rankOf(t.score)];
    const h = p === 1 ? 14 : p === 2 ? 10 : 7;
    return `<div class="pod" style="--tc:${t.color}"><div class="nm">${esc(t.name)}</div><div class="rk">${r.chev} ${r.tr} · ${r.en}</div>
      <div class="blk" style="height:${h}rem"><b>${p}</b><span>${t.score}</span></div></div>`;
  }).join("");
  const rest = order.slice(3).map((t) => `<span class="tag" style="--tc:${t.color}">${place(order.indexOf(t))}. ${esc(t.name)} · ${t.score}</span>`).join("");
  const winner = order[0];
  const tie = order.length > 1 && order[1].score === winner.score;
  return `<div class="center" style="gap:1rem">
    <div class="eyebrow">Mission complete</div>
    <h1 class="display h-xl">${tie ? "It's a tie at the top!" : `${esc(winner.name)} wins!`}</h1>
    <div class="podium">${pod}</div>
    ${rest ? `<div class="rest">${rest}</div>` : ""}
    <div class="debrief"><div class="eyebrow">Debrief · exit question</div><p>Which IDF unit would you want to visit for a day, and why? Name one thing you learned today.</p></div>
    <div class="row"><button class="btn" data-a="again">Play again, same teams</button><button class="btn small" data-a="reset">New game</button></div>
  </div>`;
}

function render() {
  renderTop();
  renderBoard();
  const st = $("#stage");
  let html = "";
  if (S.screen === "setup") html = renderSetup();
  else if (S.screen === "intro") html = renderIntro();
  else if (S.screen === "end") html = renderEnd();
  else {
    const id = round().id;
    html = id === "briefing" ? renderBriefing() : id === "trivia" ? renderTrivia() : id === "whoami" ? renderWhoAmI() : id === "commander" ? renderCommander() : renderEveryone();
  }
  st.innerHTML = html;
  st.scrollTop = 0;
  drawTimer();
}

/* ---------- Actions ---------- */
function readSetupInputs() {
  if (S.screen !== "setup") return;
  for (let i = 0; i < S.teamCount; i++) { const el = $(`#team-name-${i}`); if (el) S.names[i] = el.value; }
}
const ACTIONS = {
  count: (d) => { readSetupInputs(); S.teamCount = +d.c; render(); },
  toggleRound: (d, el) => { readSetupInputs(); S.enabled[+d.k] = el.checked; if (!S.enabled.some((e, k) => e && INTRO[ROUNDS[k].id])) { S.enabled[+d.k] = true; toast("Keep at least one round"); } render(); },
  start: () => { undoStack = []; startGame(); render(); },
  begin: () => act(beginRound),
  slidePrev: () => { S.slide = Math.max(0, S.slide - 1); render(); },
  next: () => {
    const id = round().id;
    if (S.screen === "intro") return act(beginRound);
    if (id === "briefing") { if (S.slide < SLIDES.length - 1) { S.slide++; render(); } else act(nextRound); return; }
    if (id === "commander") return act(nextRound);
    act(nextQuestion);
  },
  pick: (d) => {
    const k = +d.k, it = S.deck[S.i];
    if (S.phase === "done" || S.picks.includes(k)) return;
    act(() => {
      const stealer = (S.turn + 1) % S.teams.length;
      if (k === it.answer) {
        const who = S.phase === "steal" ? stealer : S.turn, pts = S.phase === "steal" ? 50 : 100;
        addPoints(who, pts); S.flash = `${S.teams[who].name} +${pts}${S.phase === "steal" ? " (steal!)" : ""}`;
        S.phase = "done"; SFX.ok(); stopTimer();
      } else {
        S.picks.push(k); SFX.no();
        if (S.phase === "ask" && S.teams.length > 1) { S.phase = "steal"; startTimer(15); }
        else { S.phase = "done"; S.flash = "Nobody got it. Here's the answer:"; stopTimer(); }
      }
    });
  },
  nosteal: () => act(() => { S.phase = "done"; S.flash = "No steal. Here's the answer:"; stopTimer(); }),
  timer: () => { startTimer(round().id === "trivia" ? (S.phase === "steal" ? 15 : TRIVIA_SECONDS) : SHOW_SECONDS); drawTimer(); },
  reveal: () => act(() => { S.phase = "reveal"; stopTimer(); SFX.show(); }),
  toggleTeam: (d, el) => {
    const t = +d.t, on = !S.chosen.includes(t);
    S.chosen = on ? [...S.chosen, t] : S.chosen.filter((x) => x !== t);
    el.classList.toggle("on", on);
    el.lastChild.textContent = S.teams[t].name + (on ? " ✓" : "");
    if (on) SFX.tick();
  },
  award: () => act(() => { S.chosen.forEach((t) => addPoints(t, 100)); if (S.chosen.length) SFX.ok(); nextQuestion(); }),
  clue: () => { if (S.phase === "clue" && S.shown < 4) act(() => { S.shown++; SFX.tick(); }); },
  buzz: (d) => { const t = +d.t; if (S.phase === "done" || S.locked.includes(t)) return; act(() => { S.actor = t; S.phase = "judge"; SFX.tick(); }); },
  correct: () => { if (S.phase !== "judge") return; act(() => { const v = 500 - 100 * S.shown; addPoints(S.actor, v); S.flash = `${S.teams[S.actor].name} +${v}`; S.phase = "done"; SFX.ok(); }); },
  wrong: () => {
    if (S.phase !== "judge") return;
    act(() => {
      S.locked.push(S.actor); S.actor = -1; SFX.no();
      if (S.locked.length >= S.teams.length) { S.phase = "done"; S.flash = "Nobody got it this time."; }
      else { S.phase = "clue"; if (S.shown < 4) S.shown++; }
    });
  },
  giveup: () => act(() => { S.phase = "done"; S.actor = -1; S.flash = "Nobody got it this time."; }),
  cmd: () => act(() => {
    if (!S.cmd) S.phase = "live";
    let k; do { k = Math.floor(Math.random() * CONTENT.commands.length); } while (k === S.lastCmd && CONTENT.commands.length > 1);
    S.lastCmd = k; S.cmdN++;
    S.cmd = { ...CONTENT.commands[k], says: S.cmdN <= 2 ? true : Math.random() < 0.62 };
    SFX.tick();
  }),
  outTeam: (d) => { if (S.phase === "done") return; const t = +d.t; act(() => { if (S.out.includes(t)) S.out = S.out.filter((x) => x !== t); else { S.out.push(t); SFX.out(); } }); },
  cmdWin: () => act(() => {
    const alive = S.teams.map((t, i) => i).filter((i) => !S.out.includes(i));
    alive.forEach((i) => addPoints(i, 300));
    S.flash = alive.length === 1 ? `${S.teams[alive[0]].name} +300` : alive.length ? `${alive.length} teams still standing: +300 each` : "Nobody left standing!";
    S.phase = "done"; SFX.ok();
  }),
  adj: (d) => act(() => addPoints(+d.t, +d.v)),
  undo: () => undo(),
  rounds: () => showRounds(),
  jump: (d) => { closeOverlay(); act(() => goRound(+d.k)); },
  mute: () => { muted = !muted; renderTop(); },
  full: () => toggleFull(),
  help: () => showHelp(),
  close: () => closeOverlay(),
  again: () => { const keep = S.teams.map((t) => ({ ...t, score: 0 })); undoStack = []; S.teams = keep; S.startedAt = Date.now(); S.roundIdx = -1; act(nextRound); },
  reset: () => { const names = S.teams.map((t) => t.name), n = S.teams.length, en = S.enabled; S = freshState(); S.teamCount = n; names.forEach((x, i) => (S.names[i] = x)); S.enabled = en; undoStack = []; render(); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  if (el.tagName === "INPUT" && el.type === "checkbox") return;
  const f = ACTIONS[el.dataset.a];
  if (f) f(el.dataset, el);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-a='toggleRound']");
  if (el) ACTIONS.toggleRound(el.dataset, el);
});

/* ---------- Keyboard ---------- */
function press(selector) { const b = $(selector); if (b && !b.disabled) { b.click(); return true; } return false; }
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && S.screen !== "setup") { e.preventDefault(); undo(); } return; }
  const typing = e.target.tagName === "INPUT" && e.target.type !== "checkbox";
  if (!$("#overlay").hidden) { if (e.key === "Escape" || e.key.toLowerCase() === "h") closeOverlay(); return; }
  if (S.screen === "setup") {
    if (e.key === "Enter") { e.preventDefault(); ACTIONS.start(); }
    if (!typing && e.key.toLowerCase() === "f") toggleFull();
    return;
  }
  if (typing) return;
  const k = e.key.toLowerCase();
  const id = round().id;
  if (k === " " || k === "enter") {
    e.preventDefault();
    press("[data-a='next']") || press("[data-a='begin']") || press("[data-a='award']") || press("[data-a='clue']") || press("[data-a='cmdWin'].ok") || press("[data-a='cmd']") || press("[data-a='reveal']");
    return;
  }
  if (k === "u") return undo();
  if (k === "f") return toggleFull();
  if (k === "m") return ACTIONS.mute();
  if (k === "h" || k === "?") return showHelp();
  if (S.screen !== "play") return;
  if (k === "t") return press("[data-a='timer']");
  if (k === "r") return press("[data-a='reveal']") || press("[data-a='nosteal']") || press("[data-a='giveup']");
  if (k === "c") return press("[data-a='correct']");
  if (k === "w") return press("[data-a='wrong']");
  if (id === "trivia" && "abcd".includes(k) && k.length === 1) return press(`[data-a='pick'][data-k='${"abcd".indexOf(k)}']`);
  if (/^[1-6]$/.test(k)) {
    const t = +k - 1;
    if (t >= S.teams.length) return;
    press(`[data-a='toggleTeam'][data-t='${t}']`) || press(`[data-a='buzz'][data-t='${t}']`) || press(`[data-a='outTeam'][data-t='${t}']`);
  }
  if (k === "arrowleft" && id === "briefing") ACTIONS.slidePrev();
});

/* ---------- Overlays, toasts, fullscreen ---------- */
function openOverlay(html) { const o = $("#overlay"); o.innerHTML = `<div class="sheet">${html}</div>`; o.hidden = false; }
function closeOverlay() { $("#overlay").hidden = true; }
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeOverlay(); });
function showHelp() {
  openOverlay(`<h2>Host keys</h2>
    <div class="keys">
      <kbd>Space</kbd><span>Next step (next slide, next question, next clue, next command)</span>
      <kbd>A–D</kbd><span>Trivia: the answer the team chose</span>
      <kbd>R</kbd><span>Reveal the answer · no steal · nobody knows</span>
      <kbd>1–6</kbd><span>Pick a team: who's right, who buzzed first, who's out</span>
      <kbd>C</kbd> <span>Who Am I: correct</span>
      <kbd>W</kbd> <span>Who Am I: wrong (team is locked out for that card)</span>
      <kbd>T</kbd><span>Restart the countdown</span>
      <kbd>U</kbd><span>Undo the last action (press again to keep undoing)</span>
      <kbd>F</kbd><span>Full screen</span>
      <kbd>M</kbd><span>Sound on / off</span>
    </div>
    <p class="hint">Hover over a team's score to add or take away 50 points by hand. The class clock turns red when you're behind schedule.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn small" data-a="close">Close</button></div>`);
}
function showRounds() {
  openOverlay(`<h2>Jump to a round</h2>
    <div class="jump">${ROUNDS.map((r, k) => `<button data-a="jump" data-k="${k}">${k === S.roundIdx ? "▸ " : ""}${esc(r.name)} <span class="muted">· ${r.mins} min${S.enabled[k] ? "" : " · skipped"}</span></button>`).join("")}</div>
    <p class="hint">Scores stay. Short on time? Jump straight to Real or Fake, then Awards.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn small" data-a="close">Close</button></div>`);
}
function toast(msg, sub = "") {
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = `${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ""}`;
  const box = $("#toasts"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 2600);
}
function toggleFull() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => toast("Full screen isn't available here", "Try your browser's own full-screen key (F11)"));
    else document.exitFullscreen();
  } catch (e) { toast("Full screen isn't available here"); }
}

/* ---------- Confetti ---------- */
function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d");
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = [...TEAM_COLORS, "#f2b134", "#ece3c8"];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.6, r: 5 + Math.random() * 7, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, a: Math.random() * 6, va: -0.2 + Math.random() * 0.4, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (t - t0 < 6000) requestAnimationFrame(frame); else { x.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })(t0);
}

/* ---------- Loop: clock + timer ---------- */
setInterval(() => {
  const clock = $("#clock");
  if (clock && S.startedAt) {
    const el = Date.now() - S.startedAt;
    const late = S.screen !== "end" && el > plannedEnd(S.roundIdx) * 60000;
    clock.firstChild.textContent = `${fmt(el)} `;
    clock.classList.toggle("late", late);
  }
  drawTimer();
}, 200);

/* ---------- Boot (keeps the game going if the page is updated mid-class) ---------- */
function start(data) {
  try { if (data && data.S) { S = data.S; undoStack = data.undo || []; } } catch (e) {}
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ S, undo: undoStack.slice(-20) })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
