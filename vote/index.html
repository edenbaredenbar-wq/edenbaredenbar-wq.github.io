<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B3D">
<meta name="robots" content="noindex">
<title>Class Vote · הצבעה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  html, body { min-height: 100%; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--ink); color: #fff;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  header.top .brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: .5em; }
  header.top .brand .he { font-weight: 500; opacity: .75; }
  header.top .room { font-size: .85rem; opacity: .85; letter-spacing: .08em; }
  main { flex: 1; display: flex; flex-direction: column; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; }
  .screen { flex: 1; display: flex; flex-direction: column; animation: rise .3s ease; }
  #app.static .screen { animation: none; }
  .center { justify-content: center; align-items: center; text-align: center; }
  h1 { font-size: 1.7rem; margin: .2em 0 .3em; line-height: 1.2; }
  p.lead { color: var(--muted); font-size: 1.05rem; line-height: 1.45; margin: .3em 0; }

  /* join */
  .bigicon { font-size: 4rem; line-height: 1; margin-bottom: .2em; }
  .flags-hero { font-size: 2.6rem; display: flex; gap: .3em; justify-content: center; margin-bottom: .3em; }
  .code-input {
    width: 100%; max-width: 300px; text-align: center; font-size: 2.4rem; font-weight: 700; letter-spacing: .3em;
    padding: .35em .2em .35em .5em; border-radius: 16px; border: 3px solid var(--line); background: #fff;
    text-transform: uppercase; outline: none; margin: .6em 0 .5em;
  }
  .code-input:focus { border-color: var(--il); }
  .join-btn { width: 100%; max-width: 300px; font-size: 1.25rem; padding: .9em; }
  .error { color: var(--bad); font-weight: 600; min-height: 1.4em; margin: .6em 0 0; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 1.4em; }

  /* question */
  .qmeta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 600; font-size: .9rem; margin-bottom: 10px; }
  .pill { background: var(--il-soft); color: var(--il); border-radius: 99px; padding: .3em .8em; font-size: .8rem; font-weight: 700; }
  .statement { padding: 20px 18px; font-size: 1.35rem; font-weight: 600; line-height: 1.35; text-align: center; margin-bottom: 16px; }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice {
    display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 14px 20px;
    border-radius: 18px; border: 3px solid transparent; background: #fff; box-shadow: var(--shadow);
    font-size: 1.45rem; font-weight: 700; text-align: left; transition: transform .1s, border-color .15s, background .15s, opacity .2s;
  }
  .choice:active { transform: scale(.97); }
  .choice .flag, .choice .flag-pair { font-size: 1.7rem; }
  .choice .he { margin-left: auto; font-weight: 500; font-size: 1.05rem; color: var(--muted); }
  .choice.usa { border-color: #F2C6CD; }
  .choice.israel { border-color: #C7D5F6; }
  .choice.both { border-color: #DCD3F4; }
  .choice.picked.usa { background: var(--us-red-soft); border-color: var(--us-red); }
  .choice.picked.israel { background: var(--il-soft); border-color: var(--il); }
  .choice.picked.both { background: var(--both-soft); border-color: var(--both); }
  .choice.picked::after { content: '✓'; font-size: 1.3rem; color: var(--ink); }
  .locked .choice { pointer-events: none; }
  .locked .choice:not(.correct):not(.picked) { opacity: .4; }
  .choice.correct { background: var(--good-soft); border-color: var(--good); }
  .status { text-align: center; margin-top: 18px; color: var(--muted); font-weight: 500; line-height: 1.4; min-height: 2.8em; }
  .result-banner { text-align: center; font-size: 1.5rem; font-weight: 800; padding: 14px; border-radius: 16px; margin-bottom: 14px; animation: pop .4s ease; }
  .result-banner.good { background: var(--good-soft); color: var(--good); }
  .result-banner.meh { background: #FFF3E0; color: var(--bad); }

  /* round 2 */
  .topic { text-align: center; font-size: 1.5rem; font-weight: 700; margin: 4px 0 16px; line-height: 1.25; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 18px;
    border-radius: 16px; border: 0; background: #fff; box-shadow: var(--shadow);
    font-size: 1.25rem; font-weight: 600; text-align: left;
  }
  .opt:active { transform: scale(.97); }
  .opt .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(15, 27, 61, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: rise .2s ease; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  .sheet h2 { margin: .2em 0 .8em; font-size: 1.5rem; }
  .sheet .btn { width: 100%; font-size: 1.2rem; padding: .9em; margin-top: 10px; }
  .done-icon { font-size: 4.5rem; animation: pop .5s ease; }
  .ballot { font-size: 4.5rem; animation: pulse 2.2s infinite; }

  .offline { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--bad); color: #fff; padding: .6em 1.1em; border-radius: 99px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); z-index: 20; }
  .leave { margin-top: auto; padding-top: 24px; text-align: center; }
  .leave button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .85rem; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="flagband"></div>
<header class="top">
  <div class="brand">🗳️ Class Vote <span class="he" dir="rtl" lang="he">הצבעה</span></div>
  <div class="room" id="roomLabel"></div>
</header>
<main id="app"></main>
<div class="offline" id="offline" hidden>Reconnecting…</div>

<script type="module">
import { connect, esc, heText, toArray, getPlayerId, cleanCode, FLAG, ANSWERS, ANSWER_KEYS, PARTY_COLORS, onBackendError } from './common.js';

const B = connect();
const pid = getPlayerId(B.mode === 'demo');
const app = document.getElementById('app');
const ROOM_KEY = 'electionVote.room';

let room = null;
let live = null;
let unsubLive = null;
let unsubMine = null;
let mineKey = null;
let myVote = null;
let pending = null;       // Round 2 option waiting for "Confirm"
let joinError = '';

onBackendError(err => {
  if (String(err && err.message || err).toLowerCase().includes('permission')) {
    showError('The database refused the vote. Tell your teacher (Firebase rules).');
  }
});

/* ---------------- joining ---------------- */

function storedRoom() { try { return localStorage.getItem(ROOM_KEY); } catch (e) { return null; } }
function storeRoom(code) { try { code ? localStorage.setItem(ROOM_KEY, code) : localStorage.removeItem(ROOM_KEY); } catch (e) { /* ignore */ } }

async function tryJoin(code, quiet) {
  code = cleanCode(code);
  if (code.length !== 4) { joinError = 'The code has 4 letters.'; renderJoin(code); return; }
  renderMessage('🔎', 'Joining<span class="waiting-dots"></span>', '');
  let found = null;
  try {
    found = await B.get(`rooms/${code}/live`);
  } catch (e) {
    joinError = 'Can’t reach the classroom right now. Check your internet and try again.';
    renderJoin(code);
    return;
  }
  if (!found) {
    storeRoom(null);
    joinError = quiet ? '' : `No game with the code ${code}. Check the code on the board.`;
    renderJoin(quiet ? '' : code);
    return;
  }
  room = code;
  storeRoom(code);
  history.replaceState(null, '', `?room=${code}`);
  document.getElementById('roomLabel').textContent = 'Room ' + code;
  B.set(`rooms/${code}/players/${pid}`, B.now()).catch(() => {});
  if (unsubLive) unsubLive();
  unsubLive = B.on(`rooms/${code}/live`, v => { live = v; onLive(); });
}

function leave(byStudent) {
  if (byStudent === true && room) B.remove(`rooms/${room}/players/${pid}`).catch(() => {});
  if (unsubLive) unsubLive();
  if (unsubMine) unsubMine();
  unsubLive = unsubMine = null;
  room = live = mineKey = myVote = null;
  storeRoom(null);
  history.replaceState(null, '', location.pathname);
  document.getElementById('roomLabel').textContent = '';
  renderJoin('');
}

/* ---------------- following the host ---------------- */

function currentKey() {
  if (!live) return null;
  if (live.screen === 'r1' && live.q) return live.q.key;
  if (live.screen === 'r2' && live.r2) return live.r2.key;
  return null;
}

function onLive() {
  if (!live) {           // the teacher pressed "Reset everything"
    leave();
    joinError = 'That game has ended. Enter the new code from the board.';
    renderJoin('');
    return;
  }
  const key = currentKey();
  if (key !== mineKey) {
    if (unsubMine) unsubMine();
    unsubMine = null;
    mineKey = key;
    myVote = null;
    pending = null;
    if (key) unsubMine = B.on(`rooms/${room}/votes/${key}/${pid}`, v => { myVote = v; render(); });
  }
  render();
}

function vote(value) {
  if (!room || !mineKey) return;
  const key = mineKey;
  myVote = value;
  pending = null;
  render();
  B.set(`rooms/${room}/votes/${key}/${pid}`, value).catch(() => {
    if (mineKey === key) { myVote = null; render(); }
    showError('Your vote didn’t go through. Try again.');
  });
}

/* ---------------- screens ---------------- */

let lastSig = '';
function render() {
  if (!live) return;
  // only play the fade-in when the screen really changes (not on every tap)
  const sig = [live.screen, currentKey(), live.r2 && live.r2.status, live.q && live.q.revealed, myVote == null].join('|');
  app.classList.toggle('static', sig === lastSig);
  lastSig = sig;
  if (live.screen === 'r1' && live.q) return renderR1(live.q);
  if (live.screen === 'r2' && live.r2) return renderR2(live.r2);
  renderMessage('✅', 'You’re in!', 'Look up at the board. The teacher will start soon.');
}

function renderJoin(prefill) {
  app.innerHTML = `
    <section class="screen center">
      <div class="flags-hero">${FLAG.usa}${FLAG.israel}</div>
      <h1>Join the class vote</h1>
      <p class="lead">Type the 4-letter code on the board.</p>
      <form id="joinForm" style="width:100%;display:flex;flex-direction:column;align-items:center">
        <input class="code-input" id="code" maxlength="4" autocomplete="off" autocapitalize="characters"
               spellcheck="false" inputmode="text" aria-label="Room code" value="${esc(prefill || '')}" placeholder="ABCD">
        <button class="btn blue join-btn" type="submit">Join</button>
      </form>
      <p class="error" id="err">${esc(joinError)}</p>
      <p class="note">No names, no login. Your votes are anonymous.${B.mode === 'demo' ? '<br><b>Demo mode:</b> works only on the teacher’s computer until Firebase is set up.' : ''}</p>
    </section>`;
  joinError = '';
  const input = document.getElementById('code');
  input.addEventListener('input', () => { input.value = cleanCode(input.value); });
  document.getElementById('joinForm').addEventListener('submit', e => { e.preventDefault(); tryJoin(input.value, false); });
}

function renderMessage(icon, title, text) {
  app.innerHTML = `
    <section class="screen center">
      <div class="ballot">${icon}</div>
      <h1>${title}</h1>
      <p class="lead">${text}</p>
    </section>`;
}

function renderR1(q) {
  const revealed = !!q.revealed;
  let banner = '';
  if (revealed) {
    const ans = ANSWERS[q.answer];
    if (myVote && myVote === q.answer) banner = `<div class="result-banner good">🎉 Correct!</div>`;
    else banner = `<div class="result-banner meh">The answer: ${ans ? esc(ans.label) : ''}</div>`;
  }
  const buttons = ANSWER_KEYS.map(k => {
    const cls = ['choice', k];
    if (myVote === k) cls.push('picked');
    if (revealed && q.answer === k) cls.push('correct');
    return `<button class="${cls.join(' ')}" data-answer="${k}">
      ${FLAG[k]} <span>${ANSWERS[k].label}</span>
      <bdi class="he" dir="rtl" lang="he">${ANSWERS[k].he}</bdi>
    </button>`;
  }).join('');
  let status;
  if (revealed) status = 'Look at the board for the explanation 👀';
  else if (myVote) status = 'Answer sent ✓<br>You can change it until the teacher reveals.';
  else status = 'Tap your answer.';

  app.innerHTML = `
    <section class="screen">
      <div class="qmeta"><span class="pill">USA or Israel?</span><span>Question ${q.i + 1} of ${q.n}</span></div>
      ${banner}
      <div class="statement card">${heText(q.text)}</div>
      <div class="choices ${revealed ? 'locked' : ''}">${buttons}</div>
      <p class="status">${status}</p>
      ${leaveLink()}
    </section>`;
  if (!revealed) {
    app.querySelectorAll('[data-answer]').forEach(b => b.addEventListener('click', () => vote(b.dataset.answer)));
  }
  bindLeave();
}

function renderR2(r2) {
  const options = toArray(r2.options);
  if (r2.status === 'ready') {
    return renderMessage('🗳️', 'Get ready to vote<span class="waiting-dots"></span>', `Topic: <b>${heText(r2.topic)}</b>`);
  }
  if (myVote !== null && myVote !== undefined && options[myVote] !== undefined) {
    const c = PARTY_COLORS[myVote % PARTY_COLORS.length];
    app.innerHTML = `
      <section class="screen center">
        <div class="done-icon">🗳️</div>
        <h1>Your vote is in!</h1>
        <p class="lead">You voted <b style="color:${c.bg}">${heText(options[myVote])}</b>.<br>It’s secret: no names are saved.</p>
        <p class="lead" style="margin-top:1.2em">${r2.status === 'closed' ? 'Voting is closed. Watch the board! 👀' : 'Wait for the results on the board.'}</p>
      </section>`;
    return;
  }
  if (r2.status === 'closed') {
    return renderMessage('🔒', 'Voting is closed', 'Watch the board for the results! 👀');
  }
  app.innerHTML = `
    <section class="screen">
      <div class="qmeta"><span class="pill">Class election</span><span>Vote once</span></div>
      <div class="topic">${heText(r2.topic)}</div>
      <div class="opts">
        ${options.map((o, i) => {
          const c = PARTY_COLORS[i % PARTY_COLORS.length];
          return `<button class="opt" data-opt="${i}"><span class="dot" style="background:${c.bg}"></span>${heText(o)}</button>`;
        }).join('')}
      </div>
      <p class="status">Your vote is anonymous.</p>
      ${leaveLink()}
    </section>
    ${pending !== null ? `
      <div class="sheet-bg" id="sheetBg">
        <div class="sheet">
          <div style="color:var(--muted);font-weight:600">You can only vote once</div>
          <h2>Vote for <span style="color:${PARTY_COLORS[pending % PARTY_COLORS.length].bg}">${heText(options[pending])}</span>?</h2>
          <button class="btn green" id="confirmVote">✓ Yes, vote</button>
          <button class="btn ghost" id="cancelVote">Back</button>
        </div>
      </div>` : ''}`;
  app.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { pending = Number(b.dataset.opt); render(); }));
  if (pending !== null) {
    document.getElementById('confirmVote').addEventListener('click', () => vote(pending));
    document.getElementById('cancelVote').addEventListener('click', () => { pending = null; render(); });
    document.getElementById('sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') { pending = null; render(); } });
  }
  bindLeave();
}

function leaveLink() { return `<div class="leave"><button id="leaveBtn">Not your class? Leave</button></div>`; }
function bindLeave() {
  const b = document.getElementById('leaveBtn');
  if (b) b.addEventListener('click', () => leave(true));
}

let errTimer = null;
function showError(msg) {
  const el = document.getElementById('offline');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(errTimer);
  errTimer = setTimeout(() => { el.hidden = true; el.textContent = 'Reconnecting…'; }, 5000);
}

/* Only show "Reconnecting…" if the connection is gone for a few seconds. */
let offTimer = null;
let everConnected = false;
B.onConnection(ok => {
  const el = document.getElementById('offline');
  clearTimeout(offTimer);
  if (ok) {
    everConnected = true;
    if (el.textContent === 'Reconnecting…') el.hidden = true;
    // re-register after a reconnect, in case the room was just created
    if (room) B.set(`rooms/${room}/players/${pid}`, B.now()).catch(() => {});
  } else if (everConnected) {
    offTimer = setTimeout(() => { el.textContent = 'Reconnecting…'; el.hidden = false; }, 3000);
  }
});

/* ---------------- start ---------------- */
const fromUrl = cleanCode(new URLSearchParams(location.search).get('room'));
const saved = cleanCode(storedRoom());
if (fromUrl.length === 4) tryJoin(fromUrl, false);
else if (saved.length === 4) tryJoin(saved, true);
else renderJoin('');
</script>
</body>
</html>
