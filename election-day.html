<script>

  round1: [
    { statement: "You vote for a specific person", answer: "usa",

    { statement: "You vote with paper slips marked with letters", answer: "israel",
      explain: "Israelis choose a paper slip (פתק) printed with their party’s letters, put it in an envelope, and drop it in the ballot box.",
      he: "פתק", translit: "petek", meaning: "ballot slip (a note)" },
    { statement: "Two big parties dominate", answer: "usa",
      explain: "Democrats and Republicans win almost every seat in Congress and every modern presidential election.",
      he: "", translit: "", meaning: "" },
    { statement: "Many parties make it into parliament", answer: "israel",
      explain: "Israel’s parliament, the Knesset, has 120 seats, and usually around 10 different parties win some of them.",
      he: "כנסת", translit: "Knesset", meaning: "Israel’s parliament" },
    { statement: "A party needs a minimum % of votes to get any seats", answer: "israel",
      explain: "In Israel a party needs at least 3.25% of all votes to enter the Knesset. Below that, it gets zero seats.",

    { statement: "The leader is chosen through an Electoral College", answer: "usa",

    { statement: "Parties must team up (coalition) to form a government", answer: "israel",

      he: "קואליציה", translit: "koalitzya", meaning: "coalition" },
    { statement: "Elections can be held early if the government falls", answer: "israel",

    { statement: "Election day is on a fixed date set by law", answer: "usa",
      explain: "US federal elections are always on the Tuesday after the first Monday in November, and they can’t be moved earlier. Israel has a planned date too, but elections often come early.",
      he: "", translit: "", meaning: "" },
    { statement: "You can vote at 18", answer: "both",
      explain: "In both countries, citizens can vote from age 18.",
      he: "להצביע", translit: "lehatzbia", meaning: "to vote" },
    { statement: "Your vote is secret", answer: "both",
      explain: "Both countries use a secret ballot: you vote alone, and nobody can see your choice.",
      he: "קלפי", translit: "kalpi", meaning: "ballot box" }
  ],

  /* Round 2 election topics. You pick one in class (or press 🎲 Surprise me).
     Each topic: an emoji, the question, and 2 to 8 options. */
  round2: {
    topics: [
      { icon: "🍔", topic: "Best fast food chain",
        options: ["McDonald’s", "Chipotle", "Chick-fil-A", "Taco Bell", "Wendy’s", "Panda Express", "Subway"] },
      { icon: "🎓", topic: "Best college to go to",
        options: ["Harvard", "Stanford", "NYU", "UCLA", "University of Michigan", "Duke", "Tel Aviv University"] },
      { icon: "📱", topic: "Best social media app",
        options: ["TikTok", "Instagram", "Snapchat", "YouTube", "Pinterest", "Discord"] },
      { icon: "🧆", topic: "Best Israeli food",
        options: ["Falafel פלאפל", "Shawarma שווארמה", "Hummus חומוס", "Shakshuka שקשוקה", "Schnitzel שניצל", "Bamba במבה", "Sabich סביח"] },
      { icon: "🎉", topic: "Best holiday of the year",
        options: ["Hanukkah חנוכה", "Purim פורים", "Passover פסח", "Thanksgiving", "Halloween", "Fourth of July", "Yom Ha’atzmaut יום העצמאות"] },
      { icon: "✈️", topic: "Best class trip",
        options: ["Israel", "New York City", "Disney World", "Washington, D.C.", "Hawaii", "Six Flags", "Paris"] },
      { icon: "🏀", topic: "Best sport to watch",
        options: ["Football", "Basketball", "Soccer", "Baseball", "Hockey", "Tennis"] },
      { icon: "🎬", topic: "Best streaming service",
        options: ["Netflix", "YouTube", "Disney+", "Hulu", "Max", "Prime Video"] },
      { icon: "🎵", topic: "Best kind of music",
        options: ["Pop", "Hip-hop", "Country", "Rock", "R&B", "K-pop", "Latin"] },
      { icon: "🍕", topic: "Best pizza topping",
        options: ["Pepperoni", "Plain cheese", "Mushrooms", "Pineapple", "Olives", "Sausage", "Peppers"] },
      { icon: "🦸", topic: "Best superpower",
        options: ["Flying", "Invisibility", "Teleporting", "Super strength", "Reading minds", "Time travel"] },
      { icon: "🍽️", topic: "Best school lunch",

<style>
  :root {
    --bg: #F3F6FC; --card: #FFFFFF; --ink: #0F1B3D; --muted: #5A6788; --line: #DCE3F1;
    --il: #0038B8; --il-soft: #E6EDFC; --us-red: #B22234; --us-red-soft: #FBE9EC;
    --both: #6B4FBB; --both-soft: #EFEAFB; --good: #15803D; --good-soft: #E3F6E9;
    --bad: #C2410C; --gold: #F5B700;
    --radius: 18px;
    --shadow: 0 6px 24px rgba(15, 27, 61, .08), 0 1px 3px rgba(15, 27, 61, .06);
    --font: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  /* Everything scales with the screen width, so it looks the same on any projector. */
  html { font-size: clamp(13px, 1.12vw, 24px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .he { font-family: 'Rubik', 'Arial Hebrew', 'Segoe UI', Arial, sans-serif; unicode-bidi: isolate; }

  .flagband { flex: none; height: 8px; background:
    linear-gradient(180deg, var(--il) 0 2px, #fff 2px 6px, var(--il) 6px 8px) left / 50% 100% no-repeat,
    repeating-linear-gradient(180deg, var(--us-red) 0 2px, #fff 2px 4px) right / 50% 100% no-repeat; }
  .flag { display: inline-block; height: 1em; width: auto; vertical-align: -0.12em; border-radius: 3px; box-shadow: 0 0 0 1px rgba(15, 27, 61, .15); }
  .flag-pair { display: inline-flex; gap: .2em; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; border: 0; border-radius: 14px;
         padding: .8em 1.3em; font-weight: 600; background: var(--ink); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15);
         transition: transform .08s ease, filter .15s ease; font-size: 1.05rem; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.blue { background: var(--il); }
  .btn.red { background: var(--us-red); }
  .btn.green { background: var(--good); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.ghost:hover { background: #fff; }
  .btn.small { padding: .5em .9em; border-radius: 10px; font-size: .9rem; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
  .kbd { font-size: .75em; opacity: .65; font-weight: 500; border: 1px solid currentColor; border-radius: 5px; padding: 0 .35em; margin-left: .3em; }

  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .waiting-dots::after { content: '…'; animation: pulse 1.4s infinite; }

  /* ---------- top bar ---------- */
  .topbar { flex: none; display: flex; align-items: center; gap: 1rem; padding: .55rem 1.2rem; background: var(--ink); color: #fff; }
  .topbar .brand { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: .45em; white-space: nowrap; }
  .topbar .brand .he { font-weight: 500; opacity: .7; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
  .iconbtn { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 10px; width: 2.2rem; height: 2.2rem; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; }
  .iconbtn:hover { background: rgba(255,255,255,.22); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1.2rem 2rem .8rem; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: rise .35s ease; position: relative; overflow-y: auto; overflow-x: hidden; }
  main.static .screen, main.static .row { animation: none; }
  .controls { flex: none; display: flex; align-items: center; gap: .8rem; padding-top: .8rem; }
  .controls .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: .4em; border-radius: 99px; padding: .35em .9em; font-weight: 700; font-size: .95rem; background: var(--il-soft); color: var(--il); }
  .pill.red { background: var(--us-red-soft); color: var(--us-red); }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
  .head .muted { color: var(--muted); font-weight: 600; font-size: 1.05rem; }

  /* ---------- home ---------- */
  .home { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr; gap: 3rem; align-items: center; }
  .kicker { color: var(--il); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .95rem; }
  .title { font-size: 4.4rem; line-height: 1.02; margin: .2em 0 .15em; font-weight: 900; letter-spacing: -.02em; }
  .title .flag { height: .8em; margin-left: .1em; }
  .title-he { font-size: 2.3rem; color: var(--il); font-weight: 700; display: block; margin-bottom: .35em; }
  .subtitle { font-size: 1.4rem; color: var(--muted); margin: 0 0 1.8rem; line-height: 1.45; max-width: 34rem; }
  .home-actions { display: flex; flex-wrap: wrap; gap: .8rem; }
  .home-actions .btn { font-size: 1.2rem; padding: .95em 1.5em; }
  .home-small { display: flex; gap: .6rem; margin-top: 1rem; }
  .plan { padding: 1.6rem 1.8rem; display: flex; flex-direction: column; gap: 1.1rem; }
  .plan h3 { margin: 0; font-size: 1.1rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .plan .step { display: flex; gap: 1rem; align-items: flex-start; font-size: 1.15rem; line-height: 1.4; }
  .plan .step .n { flex: none; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; background: var(--il); }
  .plan .step:nth-child(3) .n { background: var(--us-red); }
  .plan .step b { display: block; }
  .plan .step span { color: var(--muted); font-size: .95rem; }
  .hand { display: inline-block; transform-origin: 70% 90%; animation: wave 1.6s ease-in-out infinite; }

  /* ---------- round 1 ---------- */
  .statement { font-size: 3.1rem; line-height: 1.15; font-weight: 800; margin: .15em 0 .35em; letter-spacing: -.01em; }
  .statement::before { content: '“'; color: var(--il); }
  .statement::after { content: '”'; color: var(--il); }
  .vocab { display: inline-flex; align-items: center; gap: 1rem; background: #fff; border-radius: 16px; padding: .5em 1.1em; box-shadow: var(--shadow); font-size: 1.25rem; align-self: flex-start; border-left: 6px solid var(--il); }
  .vocab .tag { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .vocab .heword { font-size: 2rem; font-weight: 700; color: var(--il); }
  .vocab .tr { font-style: italic; font-weight: 500; }
  .vocab .mean { color: var(--muted); }
  .r1-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 2rem; margin-top: 1.1rem; }
  .chart { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; transition: opacity .4s; }
  .barbox { flex: 1; min-height: 4rem; position: relative; display: flex; align-items: flex-end; justify-content: center; background: rgba(15,27,61,.04); border-radius: 14px 14px 0 0; }
  .barbox .q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: rgba(15,27,61,.12); font-weight: 900; transition: opacity .3s; }
  .bar { width: 72%; height: 0; border-radius: 12px 12px 0 0; transition: height 1s cubic-bezier(.2,.8,.2,1); position: relative; }
  .col.usa .bar { background: var(--us-red); }
  .col.israel .bar { background: var(--il); }
  .col.both .bar { background: var(--both); }
  .bar .num { color: var(--ink); position: absolute; bottom: 100%; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 1.7rem; padding-bottom: .15em; opacity: 0; transition: opacity .3s .7s; }
  .bar .num small { display: block; font-size: .55em; color: var(--muted); font-weight: 600; }
  .revealed.has-hands .bar .num { opacity: 1; }
  .revealed .barbox .q { opacity: 0; }
  .col .label { background: #fff; border-radius: 0 0 14px 14px; padding: .7em .4em; text-align: center; font-weight: 800; font-size: 1.5rem; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: .15em; border: 3px solid transparent; transition: border-color .3s, background .3s; }
  .col .label .flag, .col .label .flag-pair { font-size: 2rem; }
  .col .label .he { font-size: 1rem; color: var(--muted); font-weight: 500; }
  .tally { display: flex; align-items: center; justify-content: center; gap: .4rem; margin-top: .5rem; }
  .tally button { border: 0; width: 2rem; height: 2rem; border-radius: 50%; background: #fff; box-shadow: var(--shadow); font-weight: 800; font-size: 1.1rem; color: var(--muted); }
  .tally button:hover { color: var(--ink); }
  .tally .tn { min-width: 2.2em; text-align: center; font-weight: 800; font-size: 1.2rem; color: var(--muted); }
  .revealed .tally { visibility: hidden; }
  .show-answer .col:not(.is-correct) { opacity: .35; }
  .show-answer .col.is-correct .label { border-color: var(--good); background: var(--good-soft); animation: pop .5s ease; }
  .show-answer .col.is-correct .label::before { content: '✓ Correct'; color: var(--good); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
  .side { display: flex; flex-direction: column; justify-content: center; gap: 1rem; min-height: 0; }
  .raise { text-align: center; }
  .raise .big { font-size: 6rem; line-height: 1; }
  .raise .t { font-size: 2.2rem; font-weight: 900; margin-top: .2em; }
  .raise .s { font-size: 1.2rem; color: var(--muted); margin-top: .5em; line-height: 1.45; }
  .explain { padding: 1.4rem 1.6rem; border-top: 8px solid var(--good); opacity: 0; transform: translateY(14px); transition: opacity .5s, transform .5s; }
  .show-answer .explain { opacity: 1; transform: none; }
  .explain .ans { font-size: 2rem; font-weight: 900; display: flex; align-items: center; gap: .4em; margin-bottom: .4em; }
  .explain .ans .flag, .explain .ans .flag-pair { font-size: 2rem; }
  .explain p { font-size: 1.35rem; line-height: 1.45; margin: 0; }

  .center-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; }
  .center-screen h1 { font-size: 4rem; margin: 0; }
  .center-screen p { font-size: 1.5rem; color: var(--muted); margin: 0 0 1rem; max-width: 46rem; line-height: 1.45; }
  .center-screen .btn { font-size: 1.3rem; padding: .9em 1.6em; }
  .emoji-big { font-size: 6rem; line-height: 1; }

  /* ---------- round 2: counting hands ---------- */
  .topic { font-size: 3.2rem; font-weight: 900; margin: .1em 0 .2em; letter-spacing: -.01em; }
  .count-help { font-size: 1.25rem; color: var(--muted); margin: 0 0 1rem; line-height: 1.45; }
  .count-grid { display: grid; gap: .7rem; align-content: start; }
  .count-grid.two { grid-template-columns: 1fr 1fr; column-gap: 1.4rem; }
  .crow { display: flex; align-items: center; gap: .9rem; background: #fff; border-radius: 16px; padding: .6rem .8rem .6rem 1.1rem; box-shadow: var(--shadow); font-size: 1.5rem; font-weight: 700; }
  .crow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .cbtn { flex: none; border: 0; width: 2.8rem; height: 2.8rem; border-radius: 12px; font-size: 1.6rem; font-weight: 800; background: var(--bg); color: var(--ink); }
  .crow .cbtn.plus { background: var(--il); color: #fff; }
  .crow .cbtn:active { transform: scale(.94); }
  .crow input { width: 4.2rem; text-align: center; font-size: 1.8rem; font-weight: 900; border: 2px solid var(--line); border-radius: 12px; padding: .1em 0; -moz-appearance: textfield; }
  .crow input::-webkit-inner-spin-button, .crow input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .crow input:focus { outline: none; border-color: var(--il); }
  .dot { width: .85em; height: .85em; border-radius: 50%; display: inline-block; flex: none; }
  .total-line { font-size: 1.5rem; font-weight: 700; color: var(--muted); }
  .total-line b { color: var(--ink); font-size: 2rem; }

  .pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; align-content: start; margin-top: .4rem; }
  .pick { display: grid; grid-template-columns: auto 1fr; column-gap: .7rem; align-items: center; text-align: left; padding: .65rem .9rem; border-radius: 16px; border: 3px solid transparent; background: #fff; box-shadow: var(--shadow); transition: transform .12s, border-color .15s, background .15s; min-width: 0; }
  .pick:hover { transform: translateY(-2px); border-color: var(--il-soft); }
  .pick .ic { grid-row: span 2; font-size: 2.1rem; line-height: 1; }
  .pick .tt { font-weight: 800; font-size: 1.2rem; line-height: 1.2; }
  .pick .pv { font-size: .85rem; color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pick.current { border-color: var(--line); }
  .pick.current .tt::after { content: ' · now'; color: var(--muted); font-weight: 600; font-size: .8em; }
  .pick.spin { border-color: var(--us-red); background: var(--us-red-soft); transform: scale(1.04); }
  .tpick { display: flex; flex-wrap: wrap; gap: 8px; }
  .tpick button { border: 1.5px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 14px; }
  .tpick button.on { border-color: var(--il); background: var(--il-soft); font-weight: 600; }
  .tpick button.add { border-style: dashed; color: var(--il); }

  /* ---------- round 2: results ---------- */
  .tabs { position: absolute; top: 0; right: 0; display: flex; gap: .4rem; background: #E7ECF6; padding: .3rem; border-radius: 14px; }
  .tabs button { border: 0; background: transparent; padding: .5em 1em; border-radius: 10px; font-weight: 700; font-size: 1.05rem; color: var(--muted); display: inline-flex; gap: .45em; align-items: center; }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .res-title { font-size: 2.3rem; font-weight: 900; margin: 0 0 .2em; display: flex; align-items: center; gap: .4em; }
  .res-title .flag { height: .8em; }
  .res-sub { font-size: 1.2rem; color: var(--muted); margin: 0 0 .9rem; max-width: 60%; line-height: 1.4; }
  .res-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }
  .hemi-wrap { display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .hemi { width: 100%; display: flex; justify-content: center; }
  .hemi svg { width: 100%; height: auto; max-height: 40vh; display: block; overflow: visible; }

  .hemi-cap b { display: block; font-size: 2.2rem; font-weight: 900; line-height: 1.1; }
  .hemi-cap span { color: var(--muted); font-weight: 600; font-size: 1.1rem; }
  .seat { fill: #D5DCEA; transition: fill .35s ease, opacity .35s ease; transform-box: fill-box; transform-origin: center; }

<body>
<div class="flagband"></div>
<header class="topbar">
  <div class="brand">🗳️ Election Day <bdi class="he" dir="rtl" lang="he">יום הבחירות</bdi></div>
  <div class="right">
    <button class="iconbtn" id="fsBtn" title="Full screen (F)">⛶</button>
    <button class="iconbtn" id="setBtn" title="Settings">⚙️</button>
    <button class="iconbtn" id="homeBtn" title="Home">🏠</button>
  </div>
</header>
<main id="main"></main>
<canvas id="confetti"></canvas>

<script>
(function () {
'use strict';

const main = document.getElementById('main');
const LS_STATE = 'electionDay.state';
const LS_CONTENT = 'electionDay.content';

/* ================================================================== */
/*  Helpers                                                            */
/* ================================================================== */

const clone = o => JSON.parse(JSON.stringify(o));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/** Escape text, and wrap any Hebrew inside it so it reads right-to-left. */
function heText(s) {
  return esc(s).replace(/[֐-׿]+(?:[\s\-"'״׳]+[֐-׿]+)*/g,
    m => `<bdi class="he" dir="rtl" lang="he">${m}</bdi>`);
}
const hebrew = s => `<bdi class="he" dir="rtl" lang="he">${esc(s)}</bdi>`;

/* Flags drawn as pictures, because Windows computers don't show flag emoji. */
function usFlagSvg() {
  const h = 20 / 13;
  let s = '<svg class="flag" viewBox="0 0 38 20" aria-hidden="true"><rect width="38" height="20" fill="#fff"/>';
  for (let i = 0; i < 13; i += 2) s += `<rect y="${(i * h).toFixed(3)}" width="38" height="${h.toFixed(3)}" fill="#B22234"/>`;
  s += `<rect width="15.2" height="${(7 * h).toFixed(3)}" fill="#3C3B6E"/>`;
  for (let r = 0; r < 9; r++) {
    const n = r % 2 === 0 ? 6 : 5;
    for (let c = 0; c < n; c++) {
      const x = (r % 2 === 0 ? 1.27 : 2.53) + c * 2.53;
      s += `<circle cx="${x.toFixed(2)}" cy="${(0.6 + r * 1.2).toFixed(2)}" r="0.42" fill="#fff"/>`;
    }
  }
  return s + '</svg>';
}
function ilFlagSvg() {
  return '<svg class="flag" viewBox="0 0 220 160" aria-hidden="true"><rect width="220" height="160" fill="#fff"/>' +
    '<rect y="15" width="220" height="25" fill="#0038B8"/><rect y="120" width="220" height="25" fill="#0038B8"/>' +
    '<g fill="none" stroke="#0038B8" stroke-width="5.5"><polygon points="110,47 138.6,96.5 81.4,96.5"/>' +
    '<polygon points="110,113 138.6,63.5 81.4,63.5"/></g></svg>';
}
const FLAG = { usa: usFlagSvg(), israel: ilFlagSvg() };
FLAG.both = '<span class="flag-pair">' + FLAG.usa + FLAG.israel + '</span>';

const ANSWERS = {
  usa: { label: 'USA', he: 'ארה״ב' },
  israel: { label: 'Israel', he: 'ישראל' },
  both: { label: 'Both', he: 'שתיהן' }
};
const ANSWER_KEYS = ['usa', 'israel', 'both'];

const PARTY_COLORS = [
  { bg: '#E63946', fg: '#fff' }, { bg: '#1F6FEB', fg: '#fff' }, { bg: '#F2A900', fg: '#1b1b1b' },
  { bg: '#16A085', fg: '#fff' }, { bg: '#8E44AD', fg: '#fff' }, { bg: '#F06292', fg: '#1b1b1b' },
  { bg: '#2E7D32', fg: '#fff' }, { bg: '#795548', fg: '#fff' }
];
const color = i => PARTY_COLORS[i % PARTY_COLORS.length];

/**
 * The D'Hondt method (what Israel uses to turn votes into seats).
 * Options under the threshold get 0 seats; the seats are then handed out one
 * at a time to whichever remaining option has the highest votes / (seats won + 1).
 */
function dhondt(votes, seats, thresholdPct) {
  const total = votes.reduce((a, b) => a + b, 0);
  const passed = votes.map(v => total > 0 && v > 0 && v * 100 >= thresholdPct * total - 1e-9);
  const won = votes.map(() => 0);
  if (!passed.some(Boolean)) return { total, passed, seats: won };
  for (let s = 0; s < seats; s++) {
    let best = -1, bestQ = -1;
    votes.forEach((v, i) => {
      if (!passed[i]) return;
      const q = v / (won[i] + 1);
      if (q > bestQ || (q === bestQ && v > votes[best])) { bestQ = q; best = i; }
    });
    won[best]++;
  }
  return { total, passed, seats: won };
}

const toNum = v => Math.max(0, Math.min(999, Math.round(Number(v) || 0)));

/* ================================================================== */
/*  Saved content and progress (kept in this browser)                  */
/* ================================================================== */

function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ } }
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }

function loadContent() {
  const saved = load(LS_CONTENT);
  const c = saved && Array.isArray(saved.round1) && saved.round2 ? saved : clone(DEFAULT_CONTENT);
  c.round2 = Object.assign(clone(DEFAULT_CONTENT.round2), c.round2);
  // older saves had a single topic: keep it as the first topic
  if (c.round2.topic && Array.isArray(c.round2.options)) {
    const old = { icon: '🗳️', topic: c.round2.topic, options: c.round2.options };
    if (old.topic !== DEFAULT_CONTENT.round2.topics[0].topic) c.round2.topics.unshift(old);
    delete c.round2.topic;
    delete c.round2.options;
  }
  if (!Array.isArray(c.round2.topics) || !c.round2.topics.length) c.round2.topics = clone(DEFAULT_CONTENT.round2.topics);
  return c;
}
const saveContent = () => store(LS_CONTENT, content);

const freshState = () => ({ screen: 'home', r1i: 0, r1rev: false, r1hands: {}, r2: null });
function loadState() {
  const s = load(LS_STATE);
  return s && typeof s === 'object' ? Object.assign(freshState(), s) : freshState();
}
const saveState = () => store(LS_STATE, S);

let content = loadContent();
let S = loadState();
let wasMajority = false;   // so the coalition party only fires once per majority

function go(screen) {
  S.screen = screen;
  saveState();
  render();
}

/* ================================================================== */
/*  Rendering                                                          */
/* ================================================================== */

let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

let lastSig = '';
function render() {
  clearTimers();
  // only play the fade-in when the screen really changes (not on every click)
  const sig = [S.screen, S.r1i, S.r1rev, S.r2 && S.r2.view].join('|');
  main.classList.toggle('static', sig === lastSig);
  lastSig = sig;
  if (S.screen === 'r1' && !content.round1.length) S.screen = 'home';
  if (S.screen === 'r1') renderR1();
  else if (S.screen === 'r1done') renderR1Done();
  else if (S.screen === 'pick') renderPick();
  else if (S.screen === 'r2' && S.r2) renderR2();
  else renderHome();
}
const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };

/* ---------------- home ---------------- */
function renderHome() {
  main.innerHTML = `
    <section class="screen home">
      <div>
        <div class="kicker">Hebrew class · Elections</div>
        <h1 class="title">USA ${FLAG.usa} or Israel ${FLAG.israel}?</h1>
        <span class="title-he">${hebrew('בחירות בארה״ב ובישראל')}</span>
        <p class="subtitle">How do elections work in each country? Raise your hand and find out.</p>
        <div class="home-actions">
          <button class="btn blue" id="startR1">▶ Round 1: USA or Israel?</button>
          <button class="btn red" id="startR2">Round 2: Class election →</button>
        </div>
        <div class="home-small">
          <button class="btn small ghost" id="homeSettings">⚙️ Settings</button>
          <button class="btn small ghost" id="homeReset">↺ Reset everything (new class)</button>
        </div>
      </div>
      <div class="card plan">
        <h3>Today</h3>
        <div class="step"><div class="n">1</div><div><b>USA or Israel?</b><span>Raise your hand for 🇺🇸 USA, 🇮🇱 Israel, or both.</span></div></div>
        <div class="step"><div class="n">2</div><div><b>A class election</b><span>Pick a topic, everyone votes once, and we count the same votes two ways.</span></div></div>
        <div class="step"><div class="n">3</div><div><b>Build a coalition ${hebrew('קואליציה')}</b><span>Can you team up to a majority?</span></div></div>
        <div style="font-size:3.4rem;text-align:center"><span class="hand">✋</span></div>
      </div>
    </section>`;
  // the emoji flags in the plan card are just decoration; swap in the pictures
  main.querySelectorAll('.plan .step span').forEach(el => {
    el.innerHTML = el.innerHTML.replace('🇺🇸', FLAG.usa).replace('🇮🇱', FLAG.israel);
  });
  on('startR1', startRound1);
  on('startR2', startRound2);
  on('homeSettings', () => openSettings('r1'));
  on('homeReset', resetEverything);
}

/* ---------------- round 1 ---------------- */
function startRound1() {
  if (!content.round1.length) { openSettings('r1'); return; }
  if (S.screen === 'home') { S.r1i = 0; S.r1hands = {}; }
  S.r1rev = false;
  go('r1');
}

function hands() {
  const h = S.r1hands[S.r1i] || { usa: 0, israel: 0, both: 0 };
  S.r1hands[S.r1i] = h;
  return h;
}

function renderR1() {
  if (S.r1i >= content.round1.length) S.r1i = content.round1.length - 1;
  const q = content.round1[S.r1i];
  const n = content.round1.length;
  const isLast = S.r1i === n - 1;
  const h = hands();
  const vocab = q.he || q.translit || q.meaning ? `
    <div class="vocab">
      <span class="tag">Word</span>
      ${q.he ? `<span class="heword">${hebrew(q.he)}</span>` : ''}
      ${q.translit ? `<span class="tr">${esc(q.translit)}</span>` : ''}
      ${q.meaning ? `<span class="mean">– ${esc(q.meaning)}</span>` : ''}
    </div>` : '';
  const ans = ANSWERS[q.answer] || ANSWERS.both;

  main.innerHTML = `
    <section class="screen" id="r1">
      <div class="head">
        <span class="pill">Round 1 · USA or Israel?</span>
        <span class="muted">Question ${S.r1i + 1} of ${n}</span>
      </div>
      <h1 class="statement">${heText(q.statement)}</h1>
      ${vocab}
      <div class="r1-body">
        <div class="chart">
          ${ANSWER_KEYS.map(k => `
            <div class="col ${k} ${q.answer === k ? 'is-correct' : ''}">
              <div class="barbox"><div class="q">?</div><div class="bar" data-bar="${k}"><span class="num" data-num="${k}"></span></div></div>
              <div class="label">${FLAG[k]}<span>${ANSWERS[k].label}</span>${hebrew(ANSWERS[k].he)}</div>
              <div class="tally" title="Optional: count the hands">
                <button data-hand="${k}" data-d="-1" aria-label="One fewer hand for ${ANSWERS[k].label}">−</button>
                <span class="tn" data-tn="${k}">✋ ${h[k]}</span>
                <button data-hand="${k}" data-d="1" aria-label="One more hand for ${ANSWERS[k].label}">+</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="side">
          <div class="raise" id="raiseBox">
            <div class="big"><span class="hand">✋</span></div>
            <div class="t">Raise your hand!</div>
            <div class="s">USA, Israel, or both?<br><small>Counting hands is optional: use the + buttons (or keys 1, 2, 3) to show a chart.</small></div>
          </div>
          <div class="explain card" id="explainBox" hidden>
            <div class="ans">${FLAG[q.answer] || ''} ${esc(ans.label)}</div>
            <p>${heText(q.explain || '')}</p>
          </div>
        </div>
      </div>
    </section>
    <nav class="controls">
      <button class="btn ghost" id="prevQ" ${S.r1i === 0 ? 'disabled' : ''}>← Back</button>
      <span class="spacer"></span>
      ${S.r1rev
        ? `<button class="btn blue" id="nextQ">${isLast ? 'Finish Round 1 🎉' : 'Next question →'}<span class="kbd">→</span></button>`
        : `<button class="btn green" id="revealQ">Reveal answer<span class="kbd">Space</span></button>`}
    </nav>`;

  on('prevQ', prevQuestion);
  on('revealQ', revealQuestion);
  on('nextQ', nextQuestion);
  main.querySelectorAll('[data-hand]').forEach(b => b.addEventListener('click', () => addHand(b.dataset.hand, Number(b.dataset.d))));
  if (S.r1rev) animateReveal();
}

function addHand(k, d) {
  if (S.screen !== 'r1' || S.r1rev) return;
  const h = hands();
  h[k] = Math.max(0, h[k] + d);
  saveState();
  const el = main.querySelector(`[data-tn="${k}"]`);
  if (el) el.textContent = '✋ ' + h[k];
}

function revealQuestion() {
  if (S.screen !== 'r1' || S.r1rev) return;
  S.r1rev = true;
  saveState();
  render();
}

function animateReveal() {
  const r1 = document.getElementById('r1');
  const h = hands();
  const total = h.usa + h.israel + h.both;
  const max = Math.max(1, h.usa, h.israel, h.both);
  document.getElementById('raiseBox').hidden = true;
  document.getElementById('explainBox').hidden = false;
  r1.classList.toggle('has-hands', total > 0);
  later(() => {

/* ----- hemicycle (semicircle seat chart) ----- */
function hemiLayout(n) {
  const rows = Math.max(1, Math.min(8, Math.round(Math.sqrt(n / 2.4))));
  const r0 = rows === 1 ? 1 : 0.42;
  const radii = Array.from({ length: rows }, (_, i) => rows === 1 ? 1 : r0 + (1 - r0) * i / (rows - 1));
  const sum = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.max(1, Math.round(n * r / sum)));
  counts[rows - 1] += n - counts.reduce((a, b) => a + b, 0);
  const seats = [];
  radii.forEach((r, ri) => {
    const c = counts[ri];
    for (let j = 0; j < c; j++) {
      const a = c === 1 ? Math.PI / 2 : Math.PI * j / (c - 1);
      seats.push({ x: -Math.cos(a) * r, y: Math.sin(a) * r, a, r });
    }
  });
  seats.sort((p, q) => (p.a - q.a) || (q.r - p.r));
  const gap = rows > 1 ? (1 - r0) / (rows - 1) : 0.5;
  let arc = Infinity;
  radii.forEach((r, ri) => { if (counts[ri] > 1) arc = Math.min(arc, Math.PI * r / (counts[ri] - 1)); });
  return { seats, dot: Math.min(gap * 0.38, arc * 0.38, 0.11) };
}
function hemiSvg(n, label, sub, small) {
  const { seats, dot } = hemiLayout(n);
  const m = dot + 0.03;
  const circles = seats.map((s, i) =>
    `<circle class="seat" cx="${s.x.toFixed(4)}" cy="${(-s.y).toFixed(4)}" r="${dot.toFixed(4)}"/>`).join('');
  return `<div class="hemi ${small ? 'small' : ''}"><svg viewBox="${-1 - m} ${-1 - m} ${2 + 2 * m} ${1 + 2 * m}" role="img" aria-label="${esc(label + ' ' + sub)}">${circles}</svg></div>
    <div class="hemi-cap"><b>${esc(label)}</b><span>${esc(sub)}</span></div>`;
}
/** colors: one color per seat, left to right. */
function fillSeats(colors, opts) {
  const { start = 0, step = 0, dimmed = null } = opts || {};
  main.querySelectorAll('.seat').forEach((el, i) => {
    const apply = () => {
      el.style.fill = colors[i] || '';
      if (step) el.classList.add('on');
      if (dimmed) el.classList.toggle('dim', !!dimmed[i]);
    };
    if (step || start) later(apply, start + i * step); else apply();
  });
}
function seatColors(seatCounts) {
  const out = [];
  seatCounts.forEach((s, i) => { for (let k = 0; k < s; k++) out.push(color(i).bg); });
  return out;
}
const seatsTotal = () => Math.max(1, Math.min(200, Math.round(Number(content.round2.seats) || 20)));
const majorityOf = n => Math.floor(n / 2) + 1;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

/* ----- the American way ----- */
function renderUsa(counts, total) {
  const opts = S.r2.options;
  const nSeats = seatsTotal();
  const max = Math.max(...counts);
  const winners = counts.map((c, i) => c === max ? i : -1).filter(i => i >= 0);
  const tie = winners.length > 1;
  const w = winners[0];
  const order = counts.map((c, i) => i).sort((a, b) => counts[b] - counts[a] || a - b);
  const others = total - (tie ? 0 : counts[w]);

  const rows = order.map((i, k) => {
    const isWin = !tie && i === w;
    const isTie = tie && winners.includes(i);
    return `<div class="row usa-row" data-i="${i}" style="animation-delay:${k * 70}ms; grid-template-columns: 1.3rem 1fr auto 6.5rem">
      <span class="dot" style="background:${color(i).bg}"></span>
      <span class="nm">${heText(opts[i])}</span>
      <span class="meta">${plural(counts[i], 'vote')} (${Math.round(counts[i] * 100 / total)}%)</span>
      <span class="seatsN" data-final="${isWin ? nSeats : isTie ? '?' : 0}">…</span>
    </div>`;
  }).join('');

  main.innerHTML = resultsShell('usa', `
    <h2 class="res-title">${FLAG.usa} The American way</h2>
    <p class="res-sub">Winner takes all: the option with the most votes gets <b>everything</b>.</p>
    <div class="res-grid">
      <div>
        <div class="winner-card card" id="winCard"><div class="drum">And the winner is<span class="waiting-dots"></span></div></div>
        <div class="hemi-wrap">${hemiSvg(nSeats, nSeats + ' seats', 'all for one winner', true)}</div>
      </div>
      <div>
        <div class="rows">${rows}</div>
        <div class="callout" id="usaCallout">${tie
          ? 'It’s a tie! Winner-takes-all needs one winner, so a real election would need a recount or a new vote.'
          : `<b>${others}</b> of ${total} voters (${Math.round(others * 100 / total)}%) picked something else, and their votes won <b>nothing</b>.`}</div>
      </div>
    </div>`);
  bindResultsShell('usa');

  later(() => {
    const card = document.getElementById('winCard');
    if (tie) {
      card.innerHTML = `<div class="crown">🤝</div><div class="name">It’s a tie!</div>
        <div class="takes">${winners.map(i => heText(opts[i])).join(' & ')} · ${plural(max, 'vote')} each</div>`;
    } else {
      card.innerHTML = `<div class="crown">👑</div><div class="name" style="color:${color(w).bg}">${heText(opts[w])}</div>
        <div class="takes">${plural(counts[w], 'vote')} → wins all ${nSeats} seats</div>`;
      fillSeats(new Array(nSeats).fill(color(w).bg), { start: 150, step: Math.min(40, 900 / nSeats) });
      confetti(90);
    }
    main.querySelectorAll('.usa-row').forEach(row => {
      const i = Number(row.dataset.i);
      const s = row.querySelector('.seatsN');
      s.innerHTML = `${s.dataset.final}<small>seats</small>`;
      if (!tie && i === w) row.classList.add('win');
      else if (s.dataset.final === '0') row.classList.add('lost');
    });
  }, 1500);
  later(() => document.getElementById('usaCallout').classList.add('show'), 2600);
}

/* ----- the Israeli way ----- */
const fmtPct = p => (p === 0 ? '0' : p < 10 ? p.toFixed(1) : Math.round(p));
function renderIsrael(counts, total, animate) {
  const opts = S.r2.options;
  const nSeats = seatsTotal();
  const thr = Number(content.round2.threshold) || 0;
  const res = dhondt(counts, nSeats, thr);
  const pcts = counts.map(c => c * 100 / total);
  const scale = Math.max(Math.max(...pcts), thr) * 1.12 || 1;
  const anyPassed = res.passed.some(Boolean);
  const failed = res.passed.filter(p => !p).length;

  const rows = opts.map((o, i) => `
    <div class="row il-row" data-i="${i}" style="animation-delay:${animate ? i * 70 : 0}ms">
      <span class="dot" style="background:${color(i).bg}"></span>
      <span class="nm">${heText(o)}</span>
      <div class="track">
        <div class="fill" style="background:${color(i).bg}" data-w="${(pcts[i] / scale * 100).toFixed(2)}"></div>
        <span class="pct" data-l="${(pcts[i] / scale * 100).toFixed(2)}">${counts[i]} · ${fmtPct(pcts[i])}%</span>
        <div class="tline" style="left:${thr / scale * 100}%">${i === 0 ? `<span class="tline-label">${thr}% threshold</span>` : ''}</div>
      </div>
      <span class="seatsN" data-final="${res.seats[i]}">${animate ? '' : res.seats[i] + '<small>seats</small>'}</span>
      <span class="stamp">Didn’t pass the threshold</span>
    </div>`).join('');

  main.innerHTML = resultsShell('israel', `
    <h2 class="res-title">${FLAG.israel} The Israeli way</h2>
    <p class="res-sub">The same votes become a <b>${nSeats}-seat parliament</b> (${hebrew('כנסת')}). Seats are shared out by votes, using the D’Hondt method like Israel.</p>
    <div class="res-grid">
      <div class="hemi-wrap">
        ${hemiSvg(nSeats, nSeats + ' seats', 'majority = ' + majorityOf(nSeats))}
        <div class="thr-ctl">Threshold <button id="thrDown" aria-label="Lower threshold">−</button><span class="v">${thr}%</span><button id="thrUp" aria-label="Raise threshold">+</button></div>
      </div>
      <div>
        <div class="rows">${rows}</div>
        <div class="callout blue" id="ilCallout">${!anyPassed
          ? 'No option passed the threshold! Try lowering it.'
          : failed
            ? `${failed} option${failed === 1 ? '' : 's'} didn’t reach ${thr}% and got <b>0 seats</b>. Everyone else shares the seats. Real Israel’s threshold is 3.25%.`
            : `Every option passed the ${thr}% threshold, so each one gets a fair share of seats.`}</div>
      </div>
    </div>`);
  bindResultsShell('israel');
  on('thrDown', () => changeThreshold(-1));
  on('thrUp', () => changeThreshold(1));

  const step1 = () => main.querySelectorAll('.il-row').forEach(row => {
    const fill = row.querySelector('.fill');
    fill.style.width = fill.dataset.w + '%';
    const pct = row.querySelector('.pct');
    pct.style.left = `calc(${pct.dataset.l}% + .5rem)`;
  });
  const step2 = () => main.querySelectorAll('.il-row').forEach(row => {
    if (!res.passed[Number(row.dataset.i)]) row.classList.add('fail');
  });
  const step3 = () => {
    fillSeats(seatColors(res.seats), animate ? { step: Math.min(90, 1800 / nSeats) } : null);
    main.querySelectorAll('.il-row .seatsN').forEach(s => { s.innerHTML = `${s.dataset.final}<small>seats</small>`; });
    document.getElementById('ilCallout').classList.add('show');
  };
  if (animate) { later(step1, 300); later(step2, 1600); later(step3, 2400); }
  else {
    main.querySelectorAll('.track .fill, .track .pct').forEach(el => { el.style.transition = 'none'; });
    main.querySelectorAll('.il-row').forEach(r => { r.style.animation = 'none'; });
    step1(); step2();
    main.querySelectorAll('.il-row.fail').forEach(r => { r.style.animation = 'none'; });
    step3();
  }
}
function changeThreshold(d) {
  const cur = Number(content.round2.threshold) || 0;
  const v = Math.max(0, Math.min(50, d > 0 ? Math.floor(cur + 1) : Math.ceil(cur - 1)));
  content.round2.threshold = v;
  S.r2.coalition = [];
  wasMajority = false;
  saveContent();
  saveState();
  clearTimers();
  renderIsrael(S.r2.counts, totalVotes(), false);
}

/* ----- coalition builder ----- */
function renderCoalition(counts) {
  const opts = S.r2.options;
  const nSeats = seatsTotal();
  const need = majorityOf(nSeats);
  const res = dhondt(counts, nSeats, Number(content.round2.threshold) || 0);
  S.r2.coalition = (S.r2.coalition || []).filter(i => res.seats[i] > 0);
  const inC = new Set(S.r2.coalition);
  const have = S.r2.coalition.reduce((a, i) => a + res.seats[i], 0);
  const ok = have >= need;
  const parties = opts.map((o, i) => i).filter(i => res.seats[i] > 0);

  main.innerHTML = resultsShell('coalition', `
    <h2 class="res-title">🤝 Build a coalition <span style="font-weight:700;color:var(--il)">${hebrew('קואליציה')}</span></h2>
    <p class="res-sub">Nobody rules alone unless they have a majority. Tap parties to team them up until you reach <b>${need} of ${nSeats}</b> seats.</p>
    <div class="res-grid">
      <div class="hemi-wrap">${hemiSvg(nSeats, have + ' / ' + nSeats, 'seats in the coalition')}</div>
      <div>
        <div class="meter ${ok ? 'ok' : ''}">
          <div class="nums"><b>${have}</b> seats <span class="need">· need ${need} for a majority</span>${ok ? '<span class="badge-maj">✓ Majority!</span>' : ''}</div>
          <div class="trackbig">
            <div class="fill" style="width:${Math.min(100, have / nSeats * 100)}%"></div>
            <div class="mark" style="left:calc(${need / nSeats * 100}% - 2px)"><span>${need}</span></div>
          </div>
        </div>
        <div class="pcards">
          ${parties.map(i => `
            <button class="pcard ${inC.has(i) ? 'in' : ''}" data-p="${i}" style="${inC.has(i) ? `background:${color(i).bg};color:${color(i).fg}` : ''}">
              <span class="dot" style="background:${color(i).bg};box-shadow:0 0 0 2px #fff"></span>${heText(opts[i])}
              <span class="s">${res.seats[i]}<small> seats</small></span></button>`).join('')}
        </div>
      </div>
    </div>`);
  bindResultsShell('coalition');
  document.getElementById('extraCtl').innerHTML = `<button class="btn ghost" id="resetCoal">↺ Reset coalition</button>`;
  on('resetCoal', () => { S.r2.coalition = []; wasMajority = false; saveState(); render(); });
  main.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.p);
    const set = new Set(S.r2.coalition);
    if (set.has(i)) set.delete(i); else set.add(i);
    S.r2.coalition = [...set];
    saveState();
    render();
  }));

  // everyone keeps their color; parties outside the coalition fade out
  const owner = [];
  res.seats.forEach((s, i) => { for (let k = 0; k < s; k++) owner.push(i); });
  fillSeats(seatColors(res.seats), { dimmed: owner.map(i => inC.size > 0 && !inC.has(i)) });

  if (ok && !wasMajority) celebrate(have, nSeats);
  wasMajority = ok;
}
function celebrate(have, nSeats) {
  confetti(220);
  const el = document.createElement('div');
  el.className = 'koal';
  el.innerHTML = `<div class="word">${hebrew('קואליציה!')}</div><div class="sub">Majority: ${have} of ${nSeats} seats</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('fade'), 2600);
  setTimeout(() => el.remove(), 3300);
}

/* ================================================================== */
/*  Settings                                                           */
/* ================================================================== */

let settingsTab = 'r1';
function openSettings(tab, topicIndex) {
  if (tab) settingsTab = tab;
  if (typeof topicIndex === 'number' && topicIndex >= 0) settingsTopic = topicIndex;
  let el = document.getElementById('settings');
  if (!el) {
    el = document.createElement('div');
    el.id = 'settings';
    el.className = 'settings';
    document.body.appendChild(el);
  }
  const tabs = [['r1', 'Round 1 questions'], ['r2', 'Round 2 election'], ['reset', 'Reset']];
  el.innerHTML = `
    <header><h2>⚙️ Settings</h2><span style="opacity:.7;font-size:14px">Changes save automatically in this browser.</span>
      <button class="btn small blue" id="sDone">Done</button></header>
    <nav class="stabs">${tabs.map(([k, l]) => `<button data-st="${k}" class="${k === settingsTab ? 'on' : ''}">${l}</button>`).join('')}</nav>
    <div class="sbody"><div class="sinner" id="sInner"></div></div>`;
  el.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => openSettings(b.dataset.st)));
  on('sDone', closeSettings);
  const inner = document.getElementById('sInner');
  if (settingsTab === 'r1') settingsR1(inner);
  else if (settingsTab === 'r2') settingsR2(inner);
  else settingsReset(inner);
}
function closeSettings() {
  const el = document.getElementById('settings');
  if (el) el.remove();
  lastSig = '';
  render();
}

function settingsR1(inner) {
  inner.innerHTML = `
    <p class="shelp">Each statement gets one right answer. The Hebrew word is optional: leave it empty to hide the word card.</p>
    ${content.round1.map((q, i) => `
      <div class="card qedit" data-i="${i}">
        <div class="qedit-head"><b>Question ${i + 1}</b><span class="sp"></span>
          <button data-act="up" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
          <button data-act="down" ${i === content.round1.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
          <button data-act="del" title="Delete">🗑 Delete</button></div>
        <label>Statement<input type="text" data-f="statement" value="${esc(q.statement)}"></label>
        <div class="apick"><span class="t">Correct answer:</span>
          ${ANSWER_KEYS.map(k => `<label><input type="radio" name="ans${i}" value="${k}" data-f="answer" ${q.answer === k ? 'checked' : ''}>${FLAG[k]} ${ANSWERS[k].label}</label>`).join('')}
        </div>
        <label>Explanation (shown after the reveal)<textarea data-f="explain" rows="2">${esc(q.explain)}</textarea></label>
        <div class="grid3">
          <label>Hebrew word<input type="text" data-f="he" dir="rtl" lang="he" value="${esc(q.he)}"></label>
          <label>Transliteration<input type="text" data-f="translit" value="${esc(q.translit)}"></label>
          <label>Meaning<input type="text" data-f="meaning" value="${esc(q.meaning)}"></label>
        </div>
      </div>`).join('')}
    <div style="display:flex;gap:10px">
      <button class="btn blue" id="addQ">+ Add a question</button>
      <span style="flex:1"></span>
      <button class="btn ghost" id="restoreR1">Restore the original 12 questions</button>
    </div>`;
  const onField = e => {
    const box = e.target.closest('[data-i]');
    const f = e.target.dataset.f;
    if (!box || !f) return;
    content.round1[Number(box.dataset.i)][f] = e.target.value;
    saveContent();
  };
  inner.addEventListener('input', onField);
  inner.addEventListener('change', onField);
  inner.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.closest('[data-i]').dataset.i);
    const list = content.round1;
    if (b.dataset.act === 'up' && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
    if (b.dataset.act === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
    if (b.dataset.act === 'del' && confirm(`Delete question ${i + 1}?`)) list.splice(i, 1);
    S.r1hands = {};
    saveState();
    saveContent();
    openSettings();
  }));
  on('addQ', () => {
    content.round1.push({ statement: '', answer: 'usa', explain: '', he: '', translit: '', meaning: '' });
    saveContent();
    openSettings();
    const all = document.querySelectorAll('.qedit');
    const last = all[all.length - 1];
    last.scrollIntoView({ behavior: 'smooth' });
    last.querySelector('input').focus();
  });
  on('restoreR1', () => {
    if (!confirm('Replace all Round 1 questions with the original 12?')) return;
    content.round1 = clone(DEFAULT_CONTENT.round1);
    S.r1hands = {};
    saveState();
    saveContent();
    openSettings();
  });
}

let settingsTopic = 0;
function settingsR2(inner) {
  const r2 = content.round2;
  const list = r2.topics;
  settingsTopic = Math.max(0, Math.min(list.length - 1, settingsTopic));
  const t = list[settingsTopic];
  inner.innerHTML = `
    <div class="card scard">
      <h3>Election topics</h3>
      <p>Pick a topic to edit it. In class you choose one of these at the start of Round 2.</p>
      <div class="tpick">
        ${list.map((x, i) => `<button data-st-t="${i}" class="${i === settingsTopic ? 'on' : ''}">${esc(x.icon || '🗳️')} ${heText(x.topic || 'New topic')}</button>`).join('')}
        <button id="addTopic" class="add">+ New topic</button>
      </div>
    </div>
    ${t ? `
    <div class="card scard">
      <div style="display:flex;gap:10px;align-items:end">
        <label style="width:70px">Emoji<input type="text" id="r2icon" value="${esc(t.icon || '')}" maxlength="4" style="text-align:center"></label>
        <label style="flex:1">Topic<input type="text" id="r2topic" value="${esc(t.topic)}"></label>
        <button class="btn small ghost" id="delTopic" ${list.length <= 1 ? 'disabled' : ''}>🗑 Delete topic</button>
      </div>
      <h3 style="margin-top:16px">Options (2 to 8)</h3>
      <p>These are the “parties” students vote for. 5 to 7 works best. You can add Hebrew, like <bdi class="he" dir="rtl" lang="he">חומוס</bdi>.</p>
      <div style="display:grid;gap:8px">
        ${t.options.map((o, i) => `<div class="optrow"><span class="dot" style="background:${color(i).bg}"></span>
          <input type="text" data-o="${i}" value="${esc(o)}"><button data-del="${i}" ${t.options.length <= 2 ? 'disabled' : ''}>✕</button></div>`).join('')}
      </div>
      <div style="margin-top:10px"><button class="btn small blue" id="addOpt" ${t.options.length >= 8 ? 'disabled' : ''}>+ Add option</button></div>
    </div>` : ''}
    <div class="card scard">
      <h3>The Israeli way</h3>
      <div class="grid2">
        <label>Threshold (%): options below it get 0 seats<input type="number" id="r2thr" min="0" max="50" step="0.25" value="${esc(r2.threshold)}"></label>
        <label>Seats in the class parliament<input type="number" id="r2seats" min="5" max="120" step="1" value="${esc(r2.seats)}"></label>
      </div>
      <p style="margin-top:10px">Defaults: 10% threshold and 20 seats (majority 11). Israel’s real Knesset: 3.25% and 120 seats (majority 61).</p>
    </div>
    <div><button class="btn ghost" id="restoreR2">Restore the original topics and settings</button></div>`;

  // Keep the vote in progress in step with its topic (counts stay with their option).
  const sync = () => {
    saveContent();
    if (S.r2 && S.r2.ti === settingsTopic && list[settingsTopic]) {
      const options = cleanOptions(settingsTopic);
      if (options.join('\n') !== S.r2.options.join('\n')) {
        // renamed (same number of options): keep counts in place; otherwise match by name
        const sameLength = options.length === S.r2.options.length;
        S.r2.counts = options.map((o, i) => {
          const j = sameLength ? i : S.r2.options.indexOf(o);
          return j >= 0 ? S.r2.counts[j] || 0 : 0;
        });
        S.r2.options = options;
        S.r2.coalition = [];
      }
      S.r2.topic = list[settingsTopic].topic;
      saveState();
    }
  };
  inner.querySelectorAll('[data-st-t]').forEach(b => b.addEventListener('click', () => { settingsTopic = Number(b.dataset.stT); openSettings(); }));
  on('addTopic', () => {
    list.push({ icon: '🗳️', topic: '', options: ['', ''] });
    settingsTopic = list.length - 1;
    saveContent();
    openSettings();
    document.getElementById('r2topic').focus();
  });
  if (t) {
    document.getElementById('r2icon').addEventListener('input', e => { t.icon = e.target.value; saveContent(); });
    document.getElementById('r2topic').addEventListener('input', e => { t.topic = e.target.value; sync(); });
    inner.querySelectorAll('[data-o]').forEach(inp => inp.addEventListener('input', e => { t.options[Number(e.target.dataset.o)] = e.target.value; sync(); }));
    inner.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { t.options.splice(Number(b.dataset.del), 1); sync(); openSettings(); }));
    on('addOpt', () => {
      t.options.push('');
      sync();
      openSettings();
      const inputs = document.querySelectorAll('[data-o]');
      inputs[inputs.length - 1].focus();
    });
    on('delTopic', () => {
      if (!confirm(`Delete the topic “${t.topic}”?`)) return;
      list.splice(settingsTopic, 1);
      if (S.r2) {
        if (S.r2.ti === settingsTopic) S.r2.ti = -1;          // the vote in progress keeps its own copy
        else if (S.r2.ti > settingsTopic) S.r2.ti--;
        saveState();
      }
      settingsTopic = Math.max(0, settingsTopic - 1);
      saveContent();
      openSettings();
    });
  }
  document.getElementById('r2thr').addEventListener('input', e => {
    const v = Number(e.target.value);
    if (e.target.value !== '' && v >= 0 && v <= 50) { r2.threshold = v; saveContent(); }
  });
  document.getElementById('r2seats').addEventListener('input', e => {
    const v = Math.round(Number(e.target.value));
    if (v >= 5 && v <= 120) { r2.seats = v; saveContent(); }
  });
  on('restoreR2', () => {
    if (!confirm('Restore the original topics, threshold and seats? Topics you added will be removed.')) return;
    content.round2 = clone(DEFAULT_CONTENT.round2);
    if (S.r2) { S.r2.ti = -1; saveState(); }
    settingsTopic = 0;
    saveContent();
    openSettings();
  });
}

function settingsReset(inner) {
  inner.innerHTML = `
    <div class="card scard"><h3>Reset everything (new class)</h3>
      <p>Clears all the hand counts and goes back to the start screen. Your questions and options stay.</p>
      <button class="btn red" id="sReset">↺ Reset everything</button></div>`;
  on('sReset', () => { if (resetEverything()) closeSettings(); });
}

/* ================================================================== */
/*  Reset, keyboard, confetti, start-up                                */
/* ================================================================== */

function resetEverything() {
  if (!confirm('Reset everything for a new class?\n\nAll the counts are cleared. Your questions stay.')) return false;
  S = freshState();
  wasMajority = false;
  saveState();
  lastSig = '';
  render();
  return true;
}

on('homeBtn', () => go('home'));
on('setBtn', () => openSettings());
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
on('fsBtn', toggleFullscreen);

document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || document.getElementById('settings')) return;
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
  if (S.screen === 'r1') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (S.r1rev) nextQuestion(); else revealQuestion(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); nextQuestion(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevQuestion(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3') addHand(ANSWER_KEYS[Number(e.key) - 1], 1);
  } else if (S.screen === 'r2' && S.r2 && S.r2.view !== 'count') {
    const i = VIEWS.indexOf(S.r2.view);
    if ((e.key === 'ArrowRight' || e.key === 'PageDown') && i < VIEWS.length - 1) setView(VIEWS[i + 1]);
    if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && i > 0) setView(VIEWS[i - 1]);
  }
});

function confetti(count) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#0038B8', '#B22234', '#FFFFFF', '#F5B700', '#3C3B6E', '#16A34A'];
  const parts = Array.from({ length: count }, () => ({
    x: innerWidth * (0.2 + Math.random() * 0.6), y: innerHeight * 0.45,
    vx: (Math.random() - 0.5) * 16, vy: -(8 + Math.random() * 12),
    w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
    rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.strokeStyle = 'rgba(0,0,0,.08)';
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (now - start < 4000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
  requestAnimationFrame(frame);
}

render();
})();
</script>
