<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Israeli Hitster</title>
<style>
/* Layout: projector-first. Dark stage, one bright team color at a time, big type that reads from the back row. */
:root {
  --ink: #0b0e1f;
  --panel: #151a35;
  --panel-2: #1e2449;
  --line: #2e3769;
  --text: #f6f3e8;
  --muted: #aab1d8;
  --gold: #ffd166;
  --good: #3ddc84;
  --bad: #ff5c6c;
  --euro-1: #7b2ff7;
  --euro-2: #f107a3;
  --font-display: "Segoe UI Black", "Arial Black", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-he: "Arial Hebrew", "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
  --radius: 0.9rem;
  color-scheme: dark;
}
html { font-size: clamp(14px, 0.85vw + 0.55vh, 30px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); line-height: 1.35; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

/* The YouTube player sits UNDER the app. #app has an opaque background, so the video is never visible. */
#ytDock { position: fixed; right: 0; bottom: 0; width: 320px; height: 240px; z-index: 0; overflow: hidden; pointer-events: none; }
#app { position: fixed; inset: 0; z-index: 1; background: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
#modalRoot { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(5, 7, 18, 0.78); padding: 1rem; }
#modalRoot.open { display: flex; }
#toastRoot { position: fixed; left: 1rem; bottom: 11.5rem; z-index: 60; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; pointer-events: none; max-width: min(22rem, 90vw); }
#confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; width: 100%; height: 100%; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 0.8rem; padding: 0.55rem 1rem; background: var(--panel); border-bottom: 2px solid var(--line); flex: 0 0 auto; }
.brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; letter-spacing: 0.02em; white-space: nowrap; }
.disc { width: 1.7rem; height: 1.7rem; border-radius: 50%; flex: 0 0 auto;
  background: radial-gradient(circle, var(--gold) 0 14%, var(--ink) 15% 22%, #262d5c 23% 30%, #121633 31% 44%, #262d5c 45% 52%, #121633 53% 100%); box-shadow: 0 0 0 2px #39427d; }
.pill { font-size: 0.8rem; padding: 0.2rem 0.65rem; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.topbar .spacer { flex: 1; }
.tbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 0.6rem; padding: 0.35rem 0.8rem; font-size: 0.85rem; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn--danger { border-color: #6b2a3a; color: #ffb3bd; }

.screen { flex: 1 1 auto; min-height: 0; overflow: auto; }

/* ---------- generic buttons ---------- */
.btn { border: 0; border-radius: 0.8rem; padding: 0.7rem 1.3rem; font-weight: 800; font-size: 1rem; background: var(--panel-2); border: 2px solid var(--line); display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn--primary { background: var(--gold); color: #1b1300; border-color: var(--gold); }
.btn--primary:hover:not(:disabled) { border-color: #fff; }
.btn--good { background: var(--good); color: #062512; border-color: var(--good); }
.btn--big { font-size: 1.25rem; padding: 0.85rem 1.7rem; }
.kbd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72em; font-weight: 700; padding: 0.05em 0.45em; border-radius: 0.35em; border: 1px solid currentColor; opacity: 0.75; }

/* ---------- setup ---------- */
.setup { max-width: 72rem; margin: 0 auto; padding: 1.4rem max(16px, 1.5rem) 2.5rem; display: flex; flex-direction: column; gap: 1.3rem; }
.hero { display: flex; align-items: center; gap: 1.4rem; }
.hero .disc { width: 5.5rem; height: 5.5rem; animation: spin 6s linear infinite; }
.hero h1 { font-family: var(--font-display); font-weight: 900; font-size: 3.3rem; margin: 0; line-height: 1; letter-spacing: -0.01em; text-wrap: balance; }
.hero h1 span { color: var(--gold); }
.hero p { margin: 0.4rem 0 0; color: var(--muted); font-size: 1.15rem; max-width: 42rem; }
.setup-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.2rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem; min-width: 0; }
.panel h2 { margin: 0 0 0.8rem; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.seg { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.seg button { min-width: 3rem; padding: 0.45rem 0.8rem; border-radius: 0.6rem; border: 2px solid var(--line); background: var(--panel-2); font-weight: 800; font-size: 1.1rem; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1b1300; border-color: var(--gold); }
.team-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.team-input { min-width: 0; display: flex; align-items: center; gap: 0.5rem; background: var(--panel-2); border-radius: 0.6rem; padding: 0.35rem 0.5rem; border-left: 0.5rem solid var(--tc); }
.team-input input { flex: 1; width: 100%; min-width: 0; background: transparent; border: 0; font-size: 1.05rem; font-weight: 700; padding: 0.25rem; }
.team-input input:focus { outline: none; }
.team-input:focus-within { box-shadow: 0 0 0 2px var(--gold); }
.modes { display: grid; gap: 0.7rem; }
.mode { text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 0.8rem; padding: 0.8rem 1rem; }
.mode[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.mode b { display: block; font-size: 1.2rem; font-family: var(--font-display); font-weight: 900; }
.mode span { color: var(--muted); font-size: 0.95rem; }
.setup-actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.setup-actions .stats { color: var(--muted); flex: 1; min-width: 14rem; }
.setup-actions .stats strong { color: var(--text); }
.warn-line { color: #ffcf8a; }
.howto { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.9rem 1.2rem; }
.howto summary { cursor: pointer; font-weight: 800; }
.howto ol { margin: 0.6rem 0 0; padding-left: 1.3rem; display: grid; gap: 0.3rem; color: var(--muted); }
.howto ol b { color: var(--text); }

/* ---------- game ---------- */
.game { height: 100%; display: grid; grid-template-columns: minmax(15rem, 23%) 1fr; grid-template-rows: minmax(0, 1fr) auto; }
.scoreboard { grid-row: 1; padding: 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; overflow: auto; border-right: 2px solid var(--line); background: #0e1228; }
.sb-team { border-radius: 0.8rem; padding: 0.55rem 0.7rem; background: var(--panel); border: 2px solid transparent; border-left: 0.55rem solid var(--tc); }
.sb-team.is-active { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 18%, var(--panel)); }
.sb-team.is-steal { border-color: var(--tc); border-style: dashed; }
.sb-row { display: flex; align-items: baseline; gap: 0.5rem; }
.sb-name { font-weight: 800; font-size: 1.05rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-score { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.sb-score small { font-size: 0.7em; color: var(--muted); }
.sb-meta { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.25rem; min-height: 1.1rem; }
.tokens { display: inline-flex; gap: 0.2rem; align-items: center; font-size: 0.8rem; color: var(--muted); }
.token { width: 0.95rem; height: 0.95rem; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3c4, var(--gold) 45%, #c99a2e); box-shadow: 0 0 0 1px #6b5418; display: inline-block; }
.sb-tag { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; padding: 0.05rem 0.45rem; border-radius: 99px; background: var(--tc); color: var(--ink); text-transform: uppercase; }
.scoreboard.is-crowded { gap: 0.4rem; padding: 0.6rem; }
.scoreboard.is-crowded .sb-team { padding: 0.35rem 0.6rem; }
.scoreboard.is-crowded .sb-name { font-size: 0.95rem; }
.scoreboard.is-crowded .mini { margin-top: 0.2rem; }
.mini { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.35rem; }
.mini span { font-size: 0.72rem; font-weight: 700; padding: 0.05rem 0.3rem; border-radius: 0.3rem; background: color-mix(in srgb, var(--tc) 30%, transparent); font-variant-numeric: tabular-nums; }

.stage { grid-row: 1; min-width: 0; min-height: 0; overflow: auto; padding: 1rem 1.4rem; display: flex; flex-direction: column; gap: 0.8rem; align-items: stretch; }
.turn-head { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.turn-team { font-family: var(--font-display); font-weight: 900; font-size: 2.4rem; line-height: 1.05; color: var(--tc); text-wrap: balance; }
.turn-sub { font-size: 1.15rem; color: var(--muted); }
.turn-sub b { color: var(--text); }
.placer { margin-left: auto; background: var(--panel); border: 2px dashed var(--tc); border-radius: 0.8rem; padding: 0.45rem 0.9rem; font-size: 1.05rem; }
.placer b { color: var(--tc); }
.euro-banner { border-radius: 0.8rem; padding: 0.55rem 1rem; font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.04em; text-align: center; color: #fff; font-weight: 900;
  background: linear-gradient(90deg, var(--euro-1), var(--euro-2), #ff9f1c, var(--euro-2), var(--euro-1)); background-size: 300% 100%; animation: slide 8s linear infinite; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.euro-banner small { display: block; font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em; opacity: 0.95; }

.player { position: relative; border-radius: 1.1rem; background: var(--panel); border: 2px solid var(--line); padding: 1.1rem 1.3rem; display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; align-items: center; }
.player .vinyl { width: 7.5rem; height: 7.5rem; border-radius: 50%;
  background: radial-gradient(circle, var(--tc) 0 15%, var(--ink) 16% 19%, #232a57 20% 27%, #10142e 28% 41%, #232a57 42% 49%, #10142e 50% 63%, #232a57 64% 71%, #10142e 72% 100%);
  box-shadow: 0 0 0 3px #39427d, 0 0.6rem 2rem rgba(0,0,0,0.5); }
.player.is-playing .vinyl { animation: spin 2.2s linear infinite; }
.player-main { min-width: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.np-status { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1.1; }
.np-help { color: var(--muted); font-size: 1rem; }
.eq { display: flex; align-items: flex-end; gap: 0.32rem; height: 3rem; }
.eq i { display: block; width: 0.55rem; height: 18%; border-radius: 0.2rem; background: var(--tc); opacity: 0.85; transform-origin: bottom; }
.player.is-playing .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
.eq i:nth-child(2n) { animation-duration: 0.7s !important; }
.eq i:nth-child(3n) { animation-duration: 1.15s !important; }
.eq i:nth-child(4n+1) { animation-delay: -0.4s; }
.eq i:nth-child(5n) { animation-delay: -0.2s; }
.clipbar { height: 0.5rem; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.clipbar > div { height: 100%; width: 0%; background: var(--tc); transition: width 0.2s linear; }
.controls { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.controls .btn { font-size: 1.05rem; }
.hint-badge { display: inline-block; background: var(--gold); color: #1b1300; font-weight: 800; border-radius: 0.6rem; padding: 0.25rem 0.8rem; font-size: 1.15rem; }
.actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.actions .lead { color: var(--muted); font-size: 1.15rem; flex: 1 0 100%; }
.actions .push { margin-left: auto; }
.actions .lead b { color: var(--text); }

.steal-banner { border-radius: 1rem; padding: 0.9rem 1.2rem; background: color-mix(in srgb, var(--tc) 22%, var(--panel)); border: 3px solid var(--tc); }
.steal-banner .big { font-family: var(--font-display); font-weight: 900; font-size: 2.1rem; line-height: 1.1; }
.steal-banner .miss { color: #ffb3bd; font-weight: 800; font-size: 1.15rem; }

/* reveal card */
.result { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; border-radius: 0.9rem; padding: 0.5rem 1rem; text-align: center; }
.result--good { background: color-mix(in srgb, var(--good) 22%, var(--panel)); color: #b9ffd6; border: 2px solid var(--good); }
.result--bad { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); color: #ffc7cd; border: 2px solid var(--bad); }
.reveal { display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; align-items: center; background: #fbf7ea; color: #14152a; border-radius: 1.3rem; padding: 1.3rem 1.6rem; border-top: 0.9rem solid var(--tc); box-shadow: 0 1rem 3rem rgba(0,0,0,0.5); }
.reveal.anim, .twist.anim, .history-panel.anim { animation: flipin 0.55s cubic-bezier(.2,.8,.2,1.1); }
.reveal .r-year { font-family: var(--font-display); font-weight: 900; font-size: 6.5rem; line-height: 0.9; letter-spacing: -0.03em; color: #14152a; font-variant-numeric: tabular-nums; }
.reveal .r-body { min-width: 0; }
.reveal .r-title { font-family: var(--font-display); font-weight: 900; font-size: 2.1rem; line-height: 1.1; text-wrap: balance; }
.reveal .r-artist { font-size: 1.5rem; font-weight: 700; color: #3b3f6b; margin-top: 0.2rem; }
.reveal .r-he { font-family: var(--font-he); font-size: 1.05rem; color: #5a5e86; margin-top: 0.25rem; }
.reveal .r-story { font-size: 1.2rem; margin: 0.7rem 0 0; max-width: 60ch; line-height: 1.4; }
.reveal .r-euro { display: inline-block; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; padding: 0.15rem 0.6rem; border-radius: 99px; background: linear-gradient(90deg, var(--euro-1), var(--euro-2)); }
.next-note { color: var(--gold); font-weight: 800; font-size: 1.1rem; }

/* timeline */
.tl-wrap { grid-column: 1 / -1; background: #0e1228; border-top: 2px solid var(--line); padding: 0.6rem 1rem 0.9rem; }
.tl-label { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.45rem; display: flex; gap: 0.6rem; align-items: baseline; }
.tl-label b { color: var(--tc); font-size: 1.1rem; }
.timeline { display: flex; align-items: stretch; justify-content: center; gap: 0; min-height: 8.6rem; overflow-x: auto; padding: 0.2rem 0; }
.tcard { flex: 0 1 9.2rem; min-width: 5.6rem; border-radius: 0.8rem; background: var(--tc); color: #10122a; padding: 0.55rem 0.6rem; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; gap: 0.15rem; box-shadow: 0 0.35rem 0 rgba(0,0,0,0.35); }
.tcard .tc-year { font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tcard .tc-title { font-weight: 800; font-size: 0.8rem; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tcard .tc-artist { font-size: 0.72rem; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.tcard.is-new { animation: pop 0.7s ease-out; box-shadow: 0 0 0 4px #fff, 0 0 2rem var(--tc); }
.tcard--mystery { background: repeating-linear-gradient(135deg, var(--tc) 0 0.6rem, color-mix(in srgb, var(--tc) 70%, #fff) 0.6rem 1.2rem); outline: 4px solid #fff; cursor: pointer; }
.tcard--mystery .tc-year { font-size: 3rem; }
.gap { flex: 0 0 auto; width: 2.6rem; margin: 0 0.15rem; border-radius: 0.6rem; border: 2px dashed transparent; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 800; padding: 0; }
.timeline.is-selectable .gap { border-color: color-mix(in srgb, var(--tc) 55%, transparent); color: var(--tc); background: color-mix(in srgb, var(--tc) 8%, transparent); }
.timeline.is-selectable .gap:hover { background: color-mix(in srgb, var(--tc) 28%, transparent); border-style: solid; }
.gap .gap-num { font-size: 1rem; }
.timeline.is-selectable .gap--edge { width: 3.4rem; }
.timeline:not(.is-selectable) .gap { width: 0.7rem; pointer-events: none; }

/* ---------- win ---------- */
.win { max-width: 90rem; margin: 0 auto; padding: 1.4rem max(16px, 1.5rem) 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
.win-head { text-align: center; }
.win-head .crown { font-size: 4rem; color: var(--gold); line-height: 1; }
.win-head h1 { font-family: var(--font-display); font-weight: 900; font-size: 3.8rem; margin: 0.2rem 0; line-height: 1.05; text-wrap: balance; }
.win-head p { color: var(--muted); font-size: 1.2rem; margin: 0; }
.final-row { background: var(--panel); border-radius: var(--radius); padding: 0.7rem 0.9rem; border-left: 0.6rem solid var(--tc); }
.final-row.is-winner { box-shadow: 0 0 0 3px var(--gold), 0 0 2.5rem rgba(255, 209, 102, 0.25); }
.final-row h3 { margin: 0 0 0.4rem; display: flex; gap: 0.8rem; align-items: baseline; font-size: 1.25rem; }
.final-row h3 small { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
.final-row .timeline { justify-content: flex-start; min-height: 0; }
.final-row .tcard { flex-basis: 8rem; }
.final-row .tcard .tc-year { font-size: 1.7rem; }
.win-actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }

/* ---------- editor ---------- */
.editor { padding: 1rem max(16px, 1.2rem) 2rem; font-size: 0.82rem; display: flex; flex-direction: column; gap: 0.7rem; }
.ed-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
.ed-head h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; }
.ed-head .stats { color: var(--muted); }
.ed-head input[type="search"] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.4rem 0.6rem; min-width: 14rem; }
.ed-head .spacer { flex: 1; }
.editor .btn { font-size: 0.85rem; padding: 0.45rem 0.8rem; border-width: 1px; }
.ed-note { margin: 0; color: var(--muted); max-width: 80rem; }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 0.7rem; max-height: calc(100vh - 14rem); }
table.songs { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 134rem; }
table.songs th { position: sticky; top: 0; background: var(--panel-2); text-align: left; padding: 0.45rem 0.4rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); z-index: 1; white-space: nowrap; }
table.songs td { padding: 0.3rem 0.35rem; border-top: 1px solid var(--line); vertical-align: top; }
table.songs tr.is-off td { opacity: 0.5; }
table.songs tr.is-off td:first-child { opacity: 1; }
table.songs input[type="text"], table.songs input[type="number"], table.songs textarea { width: 100%; background: var(--panel); border: 1px solid transparent; border-radius: 0.35rem; padding: 0.3rem 0.4rem; }
table.songs input:hover, table.songs textarea:hover { border-color: var(--line); }
table.songs input:focus, table.songs textarea:focus { border-color: var(--gold); outline: none; }
table.songs textarea { resize: vertical; min-height: 2.4rem; line-height: 1.3; }
table.songs input.bad { border-color: var(--bad); }
table.songs input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--gold); }
.flag { font-size: 1.05rem; text-align: center; }
.flag .warn { color: #ffcf8a; }
.flag .ok { color: var(--good); }
.yt-note { display: block; font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; min-height: 0.9rem; }
.yt-note.bad { color: var(--bad); }
.yt-note.good { color: var(--good); }
.rowbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 0.4rem; padding: 0.25rem 0.5rem; white-space: nowrap; }
.rowbtn.is-on { background: var(--gold); color: #1b1300; }
.rowbtn--del { color: #ffb3bd; }
.rowbtn--confirm { background: var(--bad); color: #fff; }
.c-year { width: 5rem; } .c-title { width: 14rem; } .c-he { width: 11rem; } .c-artist { width: 12rem; } .c-yt { width: 11rem; } .c-alt { width: 9rem; } .c-start { width: 4.6rem; } .c-story { width: 26rem; }

/* ---------- twist cards, history cards, Hebrew words ---------- */
.twist { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; border-radius: 1rem; padding: 0.7rem 1.1rem; background: color-mix(in srgb, var(--gold) 13%, var(--panel)); border: 3px solid var(--gold); }
.twist-icon { flex: 0 0 auto; width: 3.6rem; height: 3.6rem; border-radius: 50%; background: var(--gold); color: #1b1300; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; letter-spacing: -0.02em; }
.twist-main { flex: 1 1 20rem; min-width: 0; }
.twist-name { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; color: var(--gold); line-height: 1.1; }
.twist-name small { display: block; font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.twist-rule { font-size: 1.12rem; margin-top: 0.15rem; }
.twist-ctl { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.twist-state { font-weight: 800; color: var(--gold); }
.twist--compact { padding: 0.45rem 0.9rem; }
.twist--compact .twist-icon { width: 2.6rem; height: 2.6rem; font-size: 0.9rem; }
.twist--compact .twist-name { font-size: 1.2rem; }
.history-panel { border-radius: 1.1rem; background: #fbf7ea; color: #14152a; padding: 1.2rem 1.6rem; border-left: 0.9rem solid var(--tc); box-shadow: 0 0.8rem 2.5rem rgba(0,0,0,0.45); }
.hp-tag { font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.85rem; color: #7a5b0c; }
.hp-title { font-family: var(--font-display); font-weight: 900; font-size: 2.4rem; line-height: 1.12; text-wrap: balance; margin: 0.3rem 0 0.4rem; }
.hp-help { font-size: 1.15rem; color: #3b3f6b; }
.tcard--history { background: #fbf7ea; color: #14152a; box-shadow: inset 0 0 0 0.3rem var(--tc), 0 0.35rem 0 rgba(0,0,0,0.35); }
.tcard--history .tc-artist { text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-size: 0.65rem; opacity: 0.65; }
.tcard--history.is-new { box-shadow: inset 0 0 0 0.3rem var(--tc), 0 0 0 4px #fff, 0 0 2rem var(--tc); }
.reveal .r-hist { display: inline-block; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #1b1300; padding: 0.15rem 0.6rem; border-radius: 99px; background: var(--gold); }
.next-note.is-bad { color: #ffb3bd; }
.word-card { flex: 1 0 100%; display: flex; align-items: baseline; gap: 0.4rem 1rem; flex-wrap: wrap; background: var(--panel); border: 2px dashed var(--gold); border-radius: 1rem; padding: 0.55rem 1rem; }
.wc-tag { font-size: 0.8rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.wc-word { font-family: var(--font-he); font-size: 1.9rem; font-weight: 800; }
.wc-help { color: var(--muted); font-size: 1rem; }
.words { border-top: 1px solid var(--line); padding-top: 0.5rem; margin-top: 0.2rem; }
.words-h { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
.word-chip { margin: 0 0.3rem 0.35rem 0; background: var(--panel-2); border: 1px solid var(--gold); border-radius: 99px; padding: 0.15rem 0.65rem; font-size: 0.85rem; font-family: var(--font-he); }
.word-chip:hover:not(:disabled) { background: color-mix(in srgb, var(--gold) 25%, var(--panel-2)); }
.word-chip:disabled { border-color: var(--tc); color: var(--tc); cursor: default; }
.steal-pick { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.6rem; }
.steal-pick .btn { border-color: var(--tc); color: var(--tc); font-size: 1.15rem; }
.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.toggle { text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 0.8rem; padding: 0.75rem 1rem; display: flex; gap: 0.9rem; align-items: flex-start; }
.toggle .sw { flex: 0 0 auto; width: 2.6rem; height: 1.5rem; border-radius: 99px; background: var(--line); position: relative; margin-top: 0.15rem; }
.toggle .sw::after { content: ""; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--muted); transition: left 0.15s; }
.toggle[aria-pressed="true"] { border-color: var(--gold); }
.toggle[aria-pressed="true"] .sw { background: var(--gold); }
.toggle[aria-pressed="true"] .sw::after { left: 1.3rem; background: #1b1300; }
.toggle b { display: block; font-size: 1.15rem; font-family: var(--font-display); font-weight: 900; }
.toggle .d { color: var(--muted); font-size: 0.95rem; }
table.songs select { background: var(--panel); border: 1px solid var(--line); border-radius: 0.35rem; padding: 0.3rem; }
table.songs tr.is-history td.c-title input { font-weight: 700; }
.c-word { width: 13rem; }

/* ---------- modal / toast ---------- */
.modal { background: var(--panel); border: 2px solid var(--line); border-radius: 1rem; padding: 1.2rem 1.4rem; max-width: 40rem; width: 100%; box-shadow: 0 1rem 4rem rgba(0,0,0,0.6); }
.modal h2 { margin: 0 0 0.6rem; font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; }
.modal .body { color: var(--muted); font-size: 1.05rem; }
.modal .body b { color: var(--text); }
.modal .body ol, .modal .body ul { padding-left: 1.2rem; }
.modal .m-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1rem; align-items: center; }
.keys .kbd { font-size: 0.95rem; opacity: 1; text-align: center; }
.toast { background: var(--text); color: var(--ink); font-weight: 800; padding: 0.55rem 1.1rem; border-radius: 0.7rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.5); font-size: 1.05rem; animation: toastin 0.25s ease-out; text-align: left; }
.toast--bad { background: var(--bad); color: #fff; }
.toast--good { background: var(--good); color: #062512; }
.toast--gold { background: var(--gold); color: #1b1300; }
.sys-banner { background: #3a1d24; color: #ffd0d6; border: 2px solid var(--bad); border-radius: 0.8rem; padding: 0.6rem 0.9rem; font-size: 0.95rem; }
.sys-banner b { color: #fff; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes eq { 0% { height: 15%; } 100% { height: 100%; } }
@keyframes slide { to { background-position: 300% 0; } }
@keyframes flipin { from { transform: perspective(60rem) rotateX(65deg) translateY(1rem); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes toastin { from { transform: translateY(-0.6rem); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (max-width: 900px) {
  .setup-grid { grid-template-columns: 1fr; }
  .team-inputs { grid-template-columns: 1fr; }
  .extras { grid-template-columns: 1fr; }
  .game { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
  .scoreboard { border-right: 0; border-bottom: 2px solid var(--line); }
  .stage, .scoreboard { grid-row: auto; }
  .player { grid-template-columns: 1fr; }
  .reveal { grid-template-columns: 1fr; }
  .hero h1 { font-size: 2.4rem; }
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   Settings
   ========================================================= */
const CLIP_SECONDS = 20;

const LS_GAME = 'israeliHitster.game.v1';

const TEAM_COLORS = ['#ff6b5a', '#ffc23d', '#2ed3b7', '#4ea8ff', '#b47cff', '#ff7ac3'];
const DEFAULT_TEAM_NAMES = ['Team Falafel', 'Team Hummus', 'Team Sabra', 'Team Shakshuka', 'Team Bamba', 'Team Rugelach'];

  'the student sitting closest to the board',
  'a new student',
  'whoever has the next birthday',
  'a new student',
  'someone who hasn\'t spoken yet this game'
];

const LIGHTNING_SECONDS = 5;
const TWIST_EVERY = 3;        // a twist card on every 3rd turn
const HISTORY_CHANCE = 0.25;  // about 1 card in 4 is a history card
const LS_SEED = 'israeliHitster.seed';
const SEED_VERSION = 2;       // 2 = history cards and Hebrew words were added to the built-in list
const TWISTS = [
  { id: 'exact', icon: 'YEAR', name: 'Exact year', rule: 'Before the reveal, the team says one exact year out loud. This turn, the exact year is worth 2 bonus tokens instead of 1.' },
  { id: 'double', icon: '×2', name: 'Double or nothing', rule: 'The team may bet 1 token. Right spot: they get it back plus 2 more. Wrong spot: the token is gone.' },
  { id: 'lightning', icon: '5s', name: 'Lightning clip', rule: 'Only 5 seconds of music. No replays and no +10s, so listen carefully!' },

  { id: 'word', icon: 'א', name: 'Hebrew word', rule: 'After the reveal, the class learns one Hebrew word. Any team that uses it correctly later in the game earns a token.' }
];
const GLOSSARY = [
  'תודה · toda = thank you', 'סבבה · sababa = cool, all good', 'יאללה · yalla = let\'s go', 'בוקר טוב · boker tov = good morning',
  'חבר · chaver = friend', 'לחיים · l\'chaim = to life! (cheers)', 'בבקשה · bevakasha = please', 'מים · mayim = water',
  'ים · yam = sea', 'שמש · shemesh = sun', 'אוכל · ochel = food', 'כן · ken = yes'
];

/* =========================================================
   Built-in song list (researched October 2026).
   y = year, t = English title, h = Hebrew title, a = artist,
   yt = YouTube ID, alt = backup YouTube ID, s = clip start (seconds),
   e = Eurovision entry, v = year verified, story = story card text.
   ========================================================= */
const DEFAULT_SONGS = [
  { y: 1958, t: 'Erev Shel Shoshanim (Evening of Roses)', h: 'ערב של שושנים', a: 'HaDudaim', yt: 'rEdbgHeyncE', alt: 'Mx1UXlO3vsA', s: 8, e: false, v: true,
    story: 'A love song whose images come from the biblical Song of Songs. Yafa Yarkoni recorded it first in 1957, but the duo HaDudaim made it a hit in 1958, and today it is played at Jewish weddings around the world.' },
  { y: 1967, t: 'Yerushalayim Shel Zahav (Jerusalem of Gold)', h: 'ירושלים של זהב', a: 'Shuli Natan', yt: 'IUxt7faTExY', alt: 'O2RoCNeM9B0', s: 52, e: false, v: true,
    story: 'Naomi Shemer wrote it for a song festival in May 1967, and 20-year-old Shuli Natan sang it. Three weeks later the Six-Day War reunited Jerusalem, and the song became like a second national anthem.' },
  { y: 1969, t: 'Shir LaShalom (Song for Peace)', h: 'שיר לשלום', a: 'Lehakat HaNahal', yt: 'd4JyiXsta10', alt: '4-oxRVJc3Sg', s: 40, e: false, v: true,
    story: 'An army entertainment troupe first sang this call for peace, and some army leaders did not like it at first. In 1995 Prime Minister Yitzhak Rabin sang it at a peace rally, minutes before he was assassinated.' },
  { y: 1970, t: 'Ani Cholem Al Naomi (I Dream of Naomi)', h: 'אני חולם על נעמי', a: 'Hedva & David', yt: 'rTtiZ09HQJQ', alt: '8I2eE_Q_9Rw', s: 45, e: false, v: true,
    story: 'This duo won the first World Popular Song Festival in Tokyo in 1970. Their Japanese version sold more than a million copies, making it one of Israel\'s biggest hits abroad.' },
  { y: 1971, t: 'Ani Ve\'Ata (You and I)', h: 'אני ואתה', a: 'Arik Einstein', yt: 'oVOB0tJoIE8', alt: 'PixfMer7J5M', s: 30, e: false, v: true,
    story: 'Arik Einstein wrote the words and Miki Gavrielov the music. It is a gentle song about two friends who believe they can change the world, and people often compare it to John Lennon\'s "Imagine."' },
  { y: 1973, t: 'Lu Yehi (Let It Be)', h: 'לו יהי', a: 'Naomi Shemer', yt: '5Xyrr8XCmCY', alt: 'VVKc9WTAhnY', s: 45, e: false, v: true,
    story: 'Naomi Shemer released this hopeful, prayer-like song in 1973, just before the Yom Kippur War. During the war it became the song that spoke for soldiers at the front and families at home.' },
  { y: 1973, t: 'Ey Sham (Somewhere)', h: 'אי שם', a: 'Ilanit', yt: 'i1PWx0WFgbk', alt: 'VyVjY_ZGKj8', s: 60, e: true, v: true,
    story: 'Israel\'s very first Eurovision entry. Ilanit finished fourth in Luxembourg, a strong start for the newest country in the contest.' },
  { y: 1974, t: 'Natati La Chayai (I Gave Her My Life)', h: 'נתתי לה חיי', a: 'Kaveret', yt: 'Pc0A5a-lZGo', alt: 'tRGRXCDZJ9A', s: 50, e: true, v: true,
    story: 'Kaveret was Israel\'s hugely popular, funny rock band of the 1970s. This was Israel\'s Eurovision entry in 1974, the same year ABBA won with "Waterloo."' },
  { y: 1975, t: 'At Ve\'Ani (You and I)', h: 'את ואני', a: 'Shlomo Artzi', yt: 'DEENjob2l8A', alt: 'jtR1qM-rClg', s: 60, e: true, v: true,
    story: 'Shlomo Artzi sang this at Eurovision 1975 in Stockholm and finished 11th. He went on to become one of Israel\'s best-selling singers for decades.' },
  { y: 1975, t: 'Hi Kol Kach Yafa (She\'s So Beautiful)', h: 'היא כל כך יפה', a: 'Kaveret', yt: 'zAaHhoNMXS0', alt: 'vf9I1dT_umc', s: 45, e: false, v: true,
    story: 'A soft love song from Kaveret\'s third and last studio album, sung by Ephraim Shamir. Fans expected jokes and were surprised at first, but it became one of the band\'s best-loved songs.' },
  { y: 1976, t: 'Brosh (Cypress)', h: 'ברוש', a: 'Ariel Zilber', yt: 'mPJm3xpfxnU', alt: '', s: 40, e: false, v: true,
    story: 'Words by Ehud Manor, music by Ariel Zilber. The song about a cypress tree was on Zilber\'s 1976 debut album, and two years later his band named itself "Brosh" after it.' },
  { y: 1977, t: 'Erev Shel Yom Bahir (Evening of a Clear Day)', h: 'ערב של יום בהיר', a: 'Ephraim & Esther Shamir', yt: 'y3O3xSg_AIo', alt: 'AKrkg3AyV1Y', s: 40, e: false, v: false,
    story: 'Words by poet Yehonatan Geffen, music by Ephraim Shamir, who had just left the band Kaveret. Ephraim and his wife Esther recorded it as a duo.' },
  { y: 1978, t: 'A-Ba-Ni-Bi', h: 'אבניבי', a: 'Izhar Cohen & Alphabeta', yt: 'pXu5fXHDR_8', alt: 'HdmfwKUpDlg', s: 60, e: true, v: true,
    story: 'Israel\'s first Eurovision win, in Paris. The title uses a children\'s secret language that adds a "B" sound to every syllable, so "ani" (I) becomes "a-ba-ni-bi."' },
  { y: 1978, t: 'Re\'ach Shel Shokolad (Smell of Chocolate)', h: 'ריח של שוקולד', a: 'HaKeves HaShisha Asar (The Sixteenth Sheep)', yt: 'TS4HtlFLyl4', alt: 'ibOFtk5OoKQ', s: 30, e: false, v: true,
    story: 'From "The Sixteenth Sheep," a children\'s album by poet Yehonatan Geffen with music by Yoni Rechter. Kids and parents both loved it, and it became one of the best-selling Israeli albums ever.' },
  { y: 1979, t: 'Hallelujah', h: 'הללויה', a: 'Gali Atari & Milk and Honey', yt: 'OH5Ey-yvC7U', alt: 'SyvbkKjJ-1o', s: 60, e: true, v: true,
    story: 'Israel hosted Eurovision in Jerusalem in 1979 and won again, the second win in a row. "Hallelujah" became one of the best-known Eurovision songs and is sung by choirs around the world.' },
  { y: 1979, t: 'Shuv Hi Kan (She\'s Here Again)', h: 'שוב היא כאן', a: 'Yoni Rechter', yt: '_N9yWyyVd4Q', alt: 'yZrtlNOqygI', s: 45, e: false, v: true,
    story: 'From Yoni Rechter\'s first solo album, "Hitkavnut," with words by Eli Mohar. It was written for a musical that never happened, but it became a hit on its own.' },
  { y: 1979, t: 'Lakachta Et Yadi BeYadcha (You Took My Hand in Yours)', h: 'לקחת את ידי בידך', a: 'Yehudit Ravitz', yt: 'fC_O1BzhnBU', alt: 'EPvCAjKymoU', s: 40, e: false, v: true,
    story: 'The opening song of Yehudit Ravitz\'s 1979 debut album. Matti Caspi wrote the music and produced much of the album; the words are by Yankele Rotblit, who also wrote "Shir LaShalom."' },
  { y: 1979, t: 'Af Pa\'am Lo Tedi (You\'ll Never Know)', h: 'אף פעם לא תדעי', a: 'Shlomo Artzi', yt: 'f0359PUzXHo', alt: 'PMrS6VfqHvM', s: 50, e: false, v: true,
    story: 'From Shlomo Artzi\'s album "Drachim" (Ways), which gave his career a fresh new sound. He wrote both the words and the music.' },
  { y: 1981, t: 'Lo Ozev Et HaIr (Not Leaving the City)', h: 'לא עוזב את העיר', a: 'Shlomo Artzi', yt: 'BystAg_v-Do', alt: 'YT3sGGEcQp4', s: 45, e: false, v: true,
    story: 'A number-one hit from the album "Chatzot" (Midnight). When missiles hit Tel Aviv in the 1991 Gulf War, radio stations played it constantly, and the title became a phrase for people who stay put in hard times.' },
  { y: 1982, t: 'HaPerach BeGani (The Flower in My Garden)', h: 'הפרח בגני', a: 'Zohar Argov', yt: 'i9UEiER251g', alt: 'F7jROV_XRa8', s: 50, e: false, v: true,
    story: 'Zohar Argov won the 1982 Mizrahi Music Festival with this song by Avihu Medina. It was the moment Mizrahi music, with roots in Jewish communities from the Middle East and North Africa, broke into the Israeli mainstream.' },
  { y: 1982, t: 'Badad (Alone)', h: 'בדד', a: 'Zohar Argov', yt: '1uMNEJuQgeI', alt: 'uzgSWTrAJwI', s: 50, e: false, v: true,

  { y: 1983, t: 'Chai (Alive)', h: 'חי', a: 'Ofra Haza', yt: '_XMZJYxb5XU', alt: 'z81U2sLEtdY', s: 55, e: true, v: true,
    story: 'Ofra Haza finished second at Eurovision 1983 in Munich. Singing a song about Jewish survival in Germany, less than 40 years after the Holocaust, made it especially powerful, and Haza later became an international star.' },
  { y: 1983, t: 'Shavir (Fragile)', h: 'שביר', a: 'Arik Einstein & Yitzhak Klepter', yt: 'f5vnMhCttoM', alt: '6a6AFM7OEsg', s: 45, e: false, v: true,
    story: 'Arik Einstein was badly hurt in a car accident in 1982. While he was recovering, he wrote all the words for the album "Shavir" with composer Yitzhak Klepter.' },
  { y: 1985, t: 'Mechakim LaMashiach (Waiting for the Messiah)', h: 'מחכים למשיח', a: 'Shalom Hanoch', yt: 'FnMRB_G29Mc', alt: '-0i3mev5EvQ', s: 50, e: false, v: true,
    story: 'The title song of Shalom Hanoch\'s most successful album, released during a severe economic crisis in Israel. It pokes fun at people who wait for someone else to come and fix everything.' },
  { y: 1986, t: 'Shvil HaBricha (Escape Route)', h: 'שביל הבריחה', a: 'Rita', yt: 'thcsC9PpHvM', alt: '4iUS2vzCPnE', s: 50, e: false, v: true,

/* =========================================================

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const decadeOf = (y) => Math.floor(y / 10) * 10;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };

function extractYouTubeId(input) {
  const s = String(input || '').trim();
  if (!s) return '';
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:[?&]v=|\/embed\/|youtu\.be\/|\/shorts\/|\/live\/|\/v\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}
function startFromUrl(input) {
  const m = String(input || '').match(/[?&#](?:t|start)=([0-9hms]+)/);
  if (!m) return null;
  const v = m[1];
  if (/^\d+$/.test(v)) return parseInt(v, 10);
  const h = /(\d+)h/.exec(v), mi = /(\d+)m/.exec(v), se = /(\d+)s/.exec(v);
  return (h ? +h[1] * 3600 : 0) + (mi ? +mi[1] * 60 : 0) + (se ? +se[1] : 0);
}

/* =========================================================
   Songs (stored in this browser)
   ========================================================= */
function normalizeSong(s) {
  const year = parseInt(s.year ?? s.y, 10);
  return {
    id: s.id || uid(),
    year: Number.isFinite(year) ? year : '',
    title: String(s.title ?? s.t ?? ''),
    hebrew: String(s.hebrew ?? s.h ?? ''),
    artist: String(s.artist ?? s.a ?? ''),
    yt: extractYouTubeId(s.yt ?? ''),
    alt: extractYouTubeId(s.alt ?? ''),
    start: Math.max(0, parseInt(s.start ?? s.s, 10) || 0),
    euro: !!(s.euro ?? s.e),
    story: String(s.story ?? ''),
    verified: !!(s.verified ?? s.v),
    use: (s.use ?? true) !== false,
    kind: s.kind === 'history' ? 'history' : 'song',
    word: String(s.word ?? s.w ?? '')
  };
}
function defaultSongs() {
  const list = DEFAULT_SONGS.map((s, i) => normalizeSong({ ...s, w: DEFAULT_WORDS[s.t] || '', id: 'b' + String(i + 1).padStart(2, '0') }))
    .sort((a, b) => a.year - b.year);
  const history = DEFAULT_HISTORY.map((s, i) => normalizeSong({ ...s, v: true, kind: 'history', id: 'h' + String(i + 1).padStart(2, '0') }));
  return list.concat(history);
}
function loadSongs() {
  const raw = lsGet(LS_SONGS);
  if (raw) {
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        const list = arr.map(normalizeSong);
        // A list saved by an older version: add the new history cards and Hebrew words once, keep every edit.
        if ((parseInt(lsGet(LS_SEED), 10) || 1) < SEED_VERSION) {
          defaultSongs().forEach((d) => {
            const mine = list.find((x) => x.id === d.id);
            if (!mine && d.kind === 'history') list.push(d);
            else if (mine && !mine.word && d.word) mine.word = d.word;
          });
          lsSet(LS_SONGS, JSON.stringify(list));
        }
        lsSet(LS_SEED, String(SEED_VERSION));
        return list;
      }
    } catch (e) { /* fall through */ }
  }
  lsSet(LS_SEED, String(SEED_VERSION));
  return defaultSongs();
}
let songs = loadSongs();
let saveSongsTimer = null;
function saveSongs(now) {
  clearTimeout(saveSongsTimer);
  const doSave = () => { if (!lsSet(LS_SONGS, JSON.stringify(songs))) toast('Could not save songs in this browser. Use Export to back them up.', 'bad'); };
  if (now) doSave(); else saveSongsTimer = setTimeout(doSave, 300);
}
const isSong = (s) => s.kind !== 'history';
const isPlayable = (s) => s.use && Number.isFinite(s.year) && s.title.trim() !== '' && (!isSong(s) || !!s.yt);
function poolStats() {
  const songList = songs.filter(isSong);

    playable: playable.length,
    euro: playable.filter((s) => s.euro).length,

    noVideo: songList.filter((s) => s.use && !s.yt).length,
    off: songs.filter((s) => !s.use).length
  };
}

/* =========================================================
   Sound effects (tiny synth, no files)
   ========================================================= */
const Sfx = {
  ctx: null,
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } } return this.ctx; },
  tone(freq, start, dur, type = 'sine', gain = 0.12) {
    const ctx = this.ensure(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime + start);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.05);
  },
  good() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.35, 'triangle')); },
  bad() { this.tone(196, 0, 0.35, 'sawtooth', 0.07); this.tone(147, 0.18, 0.45, 'sawtooth', 0.07); },
  coin() { this.tone(988, 0, 0.12, 'square', 0.06); this.tone(1319, 0.08, 0.3, 'square', 0.06); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * 0.12, 0.4, 'triangle', 0.1)); }

/* =========================================================
   Hidden YouTube audio player
   ========================================================= */
const Audio = {
  player: null, ready: false, apiFailed: false,
  song: null, vid: '', triedAlt: false,
  start: 0, end: 0, clipLen: CLIP_SECONDS, state: 'idle', // idle | cued | playing | paused | ended | error
  context: 'game', // game | preview
  lastError: null, failsInARow: 0, tickTimer: null, listeners: [],
  onFail: null,

  init() {
    if (this.player) return;
    const vars = { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0 };
    if (location.protocol.startsWith('http')) vars.origin = location.origin;
    this.player = new YT.Player('ytPlayer', {
      width: '320', height: '240', playerVars: vars,
      events: {
        onReady: () => { this.ready = true; if (this.song) this.cue(); this.emit(); },
        onStateChange: (e) => this.handleState(e.data),
        onError: (e) => this.handleError(e.data)
      }
    });
    this.tickTimer = setInterval(() => this.tick(), 150);
  },
  on(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); },

  load(song, context = 'game', clipLen = CLIP_SECONDS) {
    this.song = song; this.context = context; this.clipLen = clipLen;
    this.vid = song.yt; this.triedAlt = false; this.lastError = null;
    this.start = song.start || 0; this.end = this.start + clipLen;
    this.state = 'cued';
    if (this.ready) this.cue();
    this.emit();
  },
  clear() { // history cards: no music this turn
    if (this.ready) { try { this.player.stopVideo(); } catch (e) { /* ignore */ } }
    this.song = null; this.state = 'idle'; this.context = 'game';
    this.emit();
  },
  cue() {
    try { this.player.cueVideoById({ videoId: this.vid, startSeconds: this.start }); } catch (e) { console.warn(e); }
  },
  now() { try { return this.player.getCurrentTime() || 0; } catch (e) { return 0; } },
  requireReady() {
    if (this.ready) return true;
    toast(this.apiFailed ? 'YouTube did not load. Check the internet connection, then reload the page.' : 'The player is still loading. Try again in a second.', 'bad');
    return false;
  },
  play() {
    if (!this.song || this.state === 'error' || !this.requireReady()) return;
    if (this.state === 'cued' || this.state === 'idle') {
      this.player.seekTo(this.start, true); this.end = this.start + this.clipLen;
    } else if (this.state === 'ended') {
      this.end = this.now() + this.clipLen; // keep listening from where the clip stopped
    }
    this.player.setVolume(100);
    this.player.playVideo();
    this.state = 'playing'; this.emit();
  },
  pause() {
    if (!this.ready || this.state !== 'playing') return;
    this.player.pauseVideo(); this.state = 'paused'; this.emit();
  },
  toggle() { if (this.state === 'playing') this.pause(); else this.play(); },
  replay() {
    if (!this.song || this.state === 'error' || !this.requireReady()) return;
    this.player.seekTo(this.start, true); this.end = this.start + this.clipLen;
    this.player.setVolume(100); this.player.playVideo();
    this.state = 'playing'; this.emit();
  },
  forward10() {
    if (!this.song || this.state === 'error' || !this.requireReady()) return;
    const from = (this.state === 'cued' || this.state === 'idle') ? this.start : this.now();
    const remaining = this.state === 'playing' || this.state === 'paused' ? Math.max(8, this.end - from) : this.clipLen;
    const to = from + 10;
    this.player.seekTo(to, true); this.end = to + remaining;
    this.player.setVolume(100); this.player.playVideo();
    this.state = 'playing'; this.emit();
  },
  stop() {
    if (this.ready) { try { this.player.stopVideo(); } catch (e) { /* ignore */ } }
    if (this.state !== 'error') this.state = this.song ? 'cued' : 'idle';
    this.emit();
  },
  progress() {
    if (this.state === 'playing' || this.state === 'paused') {
      const t = this.now(); const total = Math.max(1, this.end - this.start);
      return Math.min(1, Math.max(0, (t - (this.end - total)) / total));
    }
    return this.state === 'ended' ? 1 : 0;
  },
  tick() {
    if (!this.ready || this.state !== 'playing') return;
    const t = this.now();
    const left = this.end - t;
    if (left <= 1.5 && left > 0) this.player.setVolume(Math.max(0, Math.round((left / 1.5) * 100)));
    if (t >= this.end) {
      this.player.pauseVideo(); this.player.setVolume(100);
      this.state = 'ended';
    }
    this.emit();
  },
  handleState(s) {
    if (s === YT.PlayerState.PLAYING) this.failsInARow = 0;
    if (s === YT.PlayerState.ENDED) { this.state = 'ended'; this.emit(); }
  },
  handleError(code) {
    this.lastError = code;
    if (!this.triedAlt && this.song && this.song.alt && this.song.alt !== this.vid) {
      const wasPlaying = this.state === 'playing';
      this.triedAlt = true; this.vid = this.song.alt;
      try {
        if (wasPlaying) this.player.loadVideoById({ videoId: this.vid, startSeconds: this.start });
        else this.player.cueVideoById({ videoId: this.vid, startSeconds: this.start });
      } catch (e) { console.warn(e); }
      return;
    }
    this.state = 'error'; this.failsInARow += 1; this.emit();
    // Error 153 = YouTube wants to know which website embeds it. Opening the game as a file often causes it.
    if (code === 153 || (location.protocol === 'file:' && this.failsInARow >= 3)) showFileProtocolHelp(code);
    if (this.onFail) this.onFail(code);
  }
};
window.onYouTubeIframeAPIReady = () => Audio.init();
setTimeout(() => { if (!window.YT || !window.YT.Player) { Audio.apiFailed = true; render(); } }, 10000);

/* =========================================================
   Game state
   ========================================================= */
let game = null;
let screen = 'setup';
let returnScreen = 'setup';
let setupCfg = (() => {
  const def = { count: 4, names: DEFAULT_TEAM_NAMES.slice(), mode: 'quick', twists: true, history: true };
  try { const s = JSON.parse(lsGet(LS_SETUP) || 'null'); if (s && Array.isArray(s.names)) return { ...def, ...s, names: DEFAULT_TEAM_NAMES.map((n, i) => s.names[i] || n) }; } catch (e) { /* ignore */ }
  return def;
})();
function saveSetup() { lsSet(LS_SETUP, JSON.stringify(setupCfg)); }
function saveGame() { if (game) lsSet(LS_GAME, JSON.stringify(game)); }
function loadSavedGame() {
  try { const g = JSON.parse(lsGet(LS_GAME) || 'null'); if (g && g.v === 1 && !g.over) return g; } catch (e) { /* ignore */ }
  return null;
}

const snapOf = (s) => ({ id: s.id, kind: s.kind, year: s.year, title: s.title, hebrew: s.hebrew, artist: s.artist, story: s.story, euro: s.euro, yt: s.yt, alt: s.alt, start: s.start, word: s.word });
const forceNext = { twist: null, history: null }; // set by tests only
const card = (id) => game.snap[id];
const activeTeam = () => game.teams[game.turnIdx];

function newGame() {
  const n = setupCfg.count;
  const pool = shuffle(songs.filter((s) => isSong(s) && isPlayable(s)));
  if (pool.length < n + 3) { toast('Not enough playable songs. Add songs or turn more on in the Songs screen.', 'bad'); return; }
  game = {
    v: 1, mode: setupCfg.mode, target: setupCfg.mode === 'full' ? 7 : 4,
    teams: Array.from({ length: n }, (_, i) => ({ name: (setupCfg.names[i] || DEFAULT_TEAM_NAMES[i]).trim() || DEFAULT_TEAM_NAMES[i], color: TEAM_COLORS[i], cards: [], tokens: 0 })),
    turnIdx: 0, turnCount: 0, used: [], broken: [], snap: {}, reserve: [],
    euro: { state: 'none', left: 0 }, turn: null, over: false, ranking: null, endReason: '', startedAt: Date.now(),
    opts: { twists: !!setupCfg.twists, history: !!setupCfg.history }, words: [], lastTwist: null, lastWasHistory: false
  };
  if (game.mode === 'full') {
    const euroSongs = pool.filter((s) => s.euro);
    game.reserve = euroSongs.slice(0, Math.min(euroSongs.length, n + 2)).map((s) => s.id);
  }
  // Anchors: one face-up song per team, from different decades when possible.
  const anchorPool = pool.filter((s) => !game.reserve.includes(s.id));
  const usedDecades = new Set();
  game.teams.forEach((team) => {
    let pick = anchorPool.find((s) => !game.used.includes(s.id) && !usedDecades.has(decadeOf(s.year)));
    if (!pick) pick = anchorPool.find((s) => !game.used.includes(s.id));
    if (!pick) return;
    usedDecades.add(decadeOf(pick.year));
    game.used.push(pick.id); game.snap[pick.id] = snapOf(pick);
    team.cards.push(pick.id);
  });
  saveGame();
  showScreen('game');
  startTurn();
}

function drawCard(wantHistory) {
  const used = new Set(game.used);
  let pool = songs.filter((s) => isPlayable(s) && !used.has(s.id) && (wantHistory ? !isSong(s) : isSong(s)));
  if (wantHistory) { /* history cards ignore the Eurovision rules */ }
  else if (game.euro.state === 'active') {
    const euroPool = pool.filter((s) => s.euro);
    if (euroPool.length) pool = euroPool;
    else { game.euro.state = 'done'; toast('No Eurovision songs left. Back to the regular mix.', 'gold'); }
  } else if (game.mode === 'full' && (game.euro.state === 'none' || game.euro.state === 'pending')) {
    const regular = pool.filter((s) => !game.reserve.includes(s.id));
    if (regular.length) pool = regular;
  }
  if (!pool.length) return null;
  const s = pool[Math.floor(Math.random() * pool.length)];
  game.used.push(s.id); game.snap[s.id] = snapOf(s);
  return s;
}

function startTurn() {
  if (game.euro.state === 'pending') {
    game.euro.state = 'active'; game.euro.left = game.teams.length;
  }
  const opts = game.opts || {};
  const historyLeft = songs.some((x) => !isSong(x) && isPlayable(x) && !game.used.includes(x.id));
  let wantHistory = !!opts.history && historyLeft && game.euro.state !== 'active' && !game.lastWasHistory && Math.random() < HISTORY_CHANCE;
  if (forceNext.history != null) { wantHistory = forceNext.history && historyLeft; forceNext.history = null; }
  const s = drawCard(wantHistory) || (wantHistory ? drawCard(false) : null);
  if (!s) { finishGame('The song list ran out.'); return; }
  game.lastWasHistory = !isSong(s);
  const twist = chooseTwist(game.snap[s.id]);
  if (twist) game.lastTwist = twist;
  game.turn = {
    songId: s.id, phase: 'listen', gap: null, stealIdx: null, missGap: null,
    named: false, hint: false, result: null, receiver: null, win: null, euroNext: false,
    placer: PLACER_PROMPTS[game.turnCount % PLACER_PROMPTS.length],
    twist, bet: false, betResult: null, lightningDone: false, exactAwarded: false, word: null
  };
  saveGame();
  loadTurnAudio();
  render();
}
function chooseTwist(c) {
  if (forceNext.twist) { const id = forceNext.twist; forceNext.twist = null; return id; }
  if (!(game.opts || {}).twists || game.turnCount % TWIST_EVERY !== TWIST_EVERY - 1) return null;
  const team = activeTeam();
  const ok = TWISTS.filter((tw) => tw.id !== game.lastTwist
    && !(tw.id === 'double' && team.tokens < 1)
    && !(tw.id === 'lightning' && !isSong(c))
    && !(tw.id === 'open' && game.teams.length < 3));
  return ok.length ? ok[Math.floor(Math.random() * ok.length)].id : null;
}
function loadTurnAudio() {
  const t = game.turn; const c = card(t.songId);
  if (!isSong(c)) Audio.clear();
  else Audio.load(c, 'game', t.twist === 'lightning' ? LIGHTNING_SECONDS : CLIP_SECONDS);
}
// Play / replay / +10s go through here so history cards and the lightning clip can block them.
function doAudio(action) {
  const t = game && game.turn; if (!t || t.phase === 'reveal') return;
  if (!isSong(card(t.songId))) return;
  if (t.twist === 'lightning') {
    if (action !== 'toggle') { toast('Lightning clip: no replays and no skipping ahead.', 'gold'); return; }
    if (t.lightningDone) { toast('The lightning clip is over. No replays!', 'gold'); return; }
  }
  if (action === 'toggle') Audio.toggle(); else if (action === 'replay') Audio.replay(); else if (action === 'forward') Audio.forward10();
}

function isCorrectSpot(cards, gap, year) {
  const prev = gap > 0 ? card(cards[gap - 1]).year : -Infinity;
  const next = gap < cards.length ? card(cards[gap]).year : Infinity;
  return prev <= year && year <= next;
}
function correctGapFor(teamIdx) { // used by tests and the "where it belonged" note
  const t = game.teams[teamIdx]; const y = card(game.turn.songId).year;
  for (let g = 0; g <= t.cards.length; g++) if (isCorrectSpot(t.cards, g, y)) return g;
  return -1;
}

function selectGap(g) {
  const t = game.turn; if (!t || (t.phase !== 'listen' && t.phase !== 'steal')) return;
  if (t.phase === 'steal' && t.stealIdx == null) return;
  const team = game.teams[t.phase === 'steal' ? t.stealIdx : game.turnIdx];
  if (g < 0 || g > team.cards.length) return;
  t.gap = t.gap === g ? null : g;
  saveGame(); renderTimelineOnly(); renderActions();
}

function lockIn() {
  const t = game.turn; if (!t || t.gap == null) return;
  const song = card(t.songId);
  if (t.phase === 'listen') {
    const team = activeTeam();
    if (isCorrectSpot(team.cards, t.gap, song.year)) {
      team.cards.splice(t.gap, 0, t.songId);
      t.result = 'correct'; t.receiver = game.turnIdx; t.phase = 'reveal';
      if (t.bet) { team.tokens += 3; t.betResult = 'won'; } // the bet token comes back plus 2 more
      Sfx.good(); afterCardAdded(game.turnIdx);
    } else {
      if (t.bet) t.betResult = 'lost';
      t.missGap = t.gap; t.gap = null; t.phase = 'steal';
      t.stealIdx = t.twist === 'open' ? null : (game.turnIdx + 1) % game.teams.length;
      Sfx.bad();
    }
  } else if (t.phase === 'steal') {
    if (t.stealIdx == null) return;
    const team = game.teams[t.stealIdx];
    if (isCorrectSpot(team.cards, t.gap, song.year)) {
      team.cards.splice(t.gap, 0, t.songId);
      t.result = 'stolen'; t.receiver = t.stealIdx; Sfx.good(); afterCardAdded(t.stealIdx);
    } else {
      t.result = 'discarded'; t.receiver = null; Sfx.bad();
    }

  }

  saveGame(); render();
}
function noSteal() {
  const t = game.turn; if (!t || t.phase !== 'steal') return;
  t.result = t.stealIdx == null ? 'discarded' : 'passed'; t.receiver = null; t.phase = 'reveal';
  Audio.pause(); enterReveal(); saveGame(); render();
}
function enterReveal() {
  const t = game.turn;
  if (t.twist === 'word' && !t.word) {
    t.word = pickWord(card(t.songId));
    game.words = game.words || [];
    game.words.push({ text: t.word, by: null });
  }
}
function pickWord(c) {
  const taken = new Set((game.words || []).map((w) => w.text));
  if (c.word && !taken.has(c.word)) return c.word;
  return GLOSSARY.find((w) => !taken.has(w)) || GLOSSARY[0];
}
function chooseStealer(i) {
  const t = game.turn; if (!t || t.phase !== 'steal' || t.stealIdx != null || i === game.turnIdx || !game.teams[i]) return;
  t.stealIdx = i; t.gap = null;
  saveGame(); render();
}
function toggleBet() {
  const t = game.turn; const team = activeTeam();
  if (!t || t.twist !== 'double' || t.phase !== 'listen') return;
  if (t.bet) { t.bet = false; team.tokens += 1; }
  else { if (team.tokens < 1) return; t.bet = true; team.tokens -= 1; Sfx.coin(); }
  saveGame(); render();
}
// Every reveal: the active team named the exact year before the reveal. The Exact year twist doubles it.
const exactBonus = (t) => (t.twist === 'exact' ? 2 : 1);
function awardExactYear() {
  const t = game.turn; if (!t || t.phase !== 'reveal' || t.exactAwarded) return;
  const n = exactBonus(t);
  t.exactAwarded = true; activeTeam().tokens += n;
  Sfx.coin(); toast(`+${n} token${n > 1 ? 's' : ''} for ${activeTeam().name}`, 'gold');
  saveGame(); render();
}
function exactYearHtml() {
  const t = game.turn; const team = activeTeam(); const n = exactBonus(t);
  return t.exactAwarded
    ? `<div class="next-note">✓ Exact year! +${n} token${n > 1 ? 's' : ''} for ${esc(team.name)}.</div>`
    : `<button class="btn" data-action="exact-year" title="The team said this exact year before the reveal">${esc(team.name)} said exactly ${card(t.songId).year} ✓ (+${n} token${n > 1 ? 's' : ''})</button>`;
}
function claimWord(i) {
  const w = (game.words || [])[i]; if (!w || w.by != null) return;
  modal({
    title: `Who used “${w.text}”?`,
    body: '<p>The team that used the word correctly earns 1 token.</p>',
    actions: [{ label: 'Cancel' }].concat(game.teams.map((tm, ti) => ({
      label: tm.name,
      onClick: () => { w.by = ti; tm.tokens += 1; Sfx.coin(); toast(`+1 token for ${tm.name}`, 'gold'); saveGame(); render(); }
    })))

}
function afterCardAdded(teamIdx) {

  }

}
function nextTurn() {
  const t = game.turn; if (!t || t.phase !== 'reveal') return;
  if (t.win != null) { finishGame(''); return; }
  if (game.euro.state === 'active') {
    game.euro.left -= 1;
    if (game.euro.left <= 0) { game.euro.state = 'done'; toast('The Eurovision Round is over. Back to the regular mix.', 'gold'); }
  }
  game.turnIdx = (game.turnIdx + 1) % game.teams.length;
  game.turnCount += 1;
  Audio.stop();
  startTurn();
}

function namedIt() {
  const t = game.turn; if (!t || t.phase !== 'listen' || t.named || !isSong(card(t.songId))) return;
  t.named = true; activeTeam().tokens += 1;
  Sfx.coin(); toast(`+1 token for ${activeTeam().name}`, 'gold');
  saveGame(); render();
}
function useHint() {
  const t = game.turn; const team = activeTeam();

function replaceCurrentSong(message) {

  Object.assign(t, { songId: s.id, gap: null, named: false, hint: false, lightningDone: false });
  if (t.twist === 'lightning' && !isSong(s)) t.twist = null;

Audio.onFail = (code) => {

    return;
  }
  const t = game.turn;
  if (Audio.song && Audio.song.id === t.songId) game.broken.push(t.songId);
  if (t.phase === 'listen') {
    if (t.hint) { activeTeam().tokens += 1; }
    replaceCurrentSong('That clip can\'t play here, so here is a different song. No penalty.');
  } else {
    toast(`That clip can't play here (error ${code}). You can still finish this turn.`, 'bad');
  }
};

function finishGame(reason) {
  Audio.stop();
  const ranking = game.teams.map((tm, i) => ({ i, cards: tm.cards.length, tokens: tm.tokens }))
    .sort((a, b) => b.cards - a.cards || b.tokens - a.tokens);
  const top = ranking[0];
  game.winners = ranking.filter((r) => r.cards === top.cards && r.tokens === top.tokens).map((r) => r.i);
  game.ranking = ranking.map((r) => r.i);
  game.over = true; game.endReason = reason;
  saveGame(); lsDel(LS_GAME);
  showScreen('win');
  Sfx.win(); Confetti.burst(game.winners.map((i) => game.teams[i].color));
}

function confirmEndGame() {
  if (!game || game.over) return;
  modal({
    title: 'End the game now?',
    body: '<p>The team with the <b>most songs</b> on its timeline wins. If teams are tied, the team with <b>more tokens</b> wins.</p>',
    actions: [{ label: 'Keep playing' }, { label: 'End game', kind: 'primary', onClick: () => finishGame('The host ended the game.') }]
  });

/* =========================================================
   Rendering
   ========================================================= */
const screenEl = $('#screen');
function showScreen(name) {
  if (name === 'songs' && screen !== 'songs') returnScreen = screen;
