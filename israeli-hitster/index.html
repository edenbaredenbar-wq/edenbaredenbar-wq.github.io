    </div>
    <p class="ed-note">Changes save automatically in this browser. <span class="warn">⚠</span> means the year is not verified yet. Songs with no YouTube link, or with “Use” turned off, are never drawn. Paste a full YouTube link and the ID is pulled out for you. “Start” is where the 20-second clip begins; use ▶ to check it. History cards need no video: their title is shown before the reveal, and the year and story after. “Hebrew word” is used by the Hebrew word twist card.</p>
    <div class="table-wrap">
      <table class="songs">
        <thead><tr>
          <th>Use</th><th>Type</th><th title="Verified year">✓/⚠</th><th>Year</th><th>English title</th><th>Hebrew title</th><th>Artist</th><th>YouTube link or ID</th><th>Backup ID</th><th>Start (s)</th><th>Eurovision</th><th>Story card</th><th>Hebrew word</th><th>Verified</th><th>Clip</th><th></th>
        </tr></thead>
        <tbody id="edBody">${songs.map(editorRow).join('')}</tbody>
      </table>
    </div>
  </section>`;
  applyEditorFilter();
  renderEditorPreviewButtons();
}
function editorRow(s) {
  const flag = s.verified ? '<span class="ok" title="Year verified">✓</span>' : '<span class="warn" title="Year not verified">⚠</span>';
  const del = pendingDelete.has(s.id)
    ? `<button class="rowbtn rowbtn--confirm" data-action="del-song">Confirm delete</button>`
    : `<button class="rowbtn rowbtn--del" data-action="del-song">Delete</button>`;
  const h = !isSong(s);
  const songCells = h
    ? `<td class="c-yt"><span class="yt-note">No video needed for history cards</span></td><td></td><td></td><td></td>`
    : `<td class="c-yt"><input type="text" data-f="yt" value="${esc(s.yt)}" placeholder="Paste link or ID" aria-label="YouTube link or ID" class="${s.yt ? '' : 'bad'}"><span class="yt-note ${s.yt ? '' : 'bad'}">${s.yt ? '' : 'No video: skipped'}</span></td>
    <td class="c-alt"><input type="text" data-f="alt" value="${esc(s.alt)}" placeholder="Optional" aria-label="Backup YouTube ID"></td>
    <td class="c-start"><input type="number" data-f="start" value="${esc(s.start)}" min="0" aria-label="Clip start in seconds"></td>
    <td><input type="checkbox" data-f="euro" ${s.euro ? 'checked' : ''} aria-label="Eurovision song"></td>`;
  return `<tr data-id="${s.id}" class="${s.use ? '' : 'is-off'} ${h ? 'is-history' : ''}">
    <td><input type="checkbox" data-f="use" ${s.use ? 'checked' : ''} aria-label="Use in game"></td>
    <td><select data-f="kind" aria-label="Card type"><option value="song" ${h ? '' : 'selected'}>Song</option><option value="history" ${h ? 'selected' : ''}>History</option></select></td>
    <td class="flag">${flag}</td>
    <td class="c-year"><input type="number" data-f="year" value="${esc(s.year)}" min="1800" max="2100" aria-label="Year"></td>
    <td class="c-title"><input type="text" data-f="title" value="${esc(s.title)}" placeholder="${h ? 'What happened (shown before the reveal)' : ''}" aria-label="${h ? 'What happened' : 'English title'}"></td>
    <td class="c-he"><input type="text" data-f="hebrew" value="${esc(s.hebrew)}" dir="rtl" lang="he" aria-label="Hebrew title"></td>
    <td class="c-artist">${h ? '' : `<input type="text" data-f="artist" value="${esc(s.artist)}" aria-label="Artist">`}</td>
    ${songCells}
    <td class="c-story"><textarea data-f="story" rows="2" aria-label="Story card">${esc(s.story)}</textarea></td>
    <td class="c-word"><input type="text" data-f="word" value="${esc(s.word)}" placeholder="זהב · zahav = gold" aria-label="Hebrew word"></td>
    <td><input type="checkbox" data-f="verified" ${s.verified ? 'checked' : ''} aria-label="Year verified"></td>
    <td>${h ? '' : `<button class="rowbtn" data-action="preview" ${s.yt ? '' : 'disabled'}>▶ Test</button>`}</td>
    <td>${del}</td>
  </tr>`;
}
function applyEditorFilter() {
  const q = editorFilter.trim().toLowerCase();
  document.querySelectorAll('#edBody tr').forEach((tr) => {
    const s = songs.find((x) => x.id === tr.dataset.id);
    const hay = s ? `${s.year} ${s.title} ${s.hebrew} ${s.artist} ${s.kind} ${s.word}`.toLowerCase() : '';
    tr.hidden = q !== '' && !hay.includes(q);
  });
}
function updateEditorStats() {
  const el = $('#edStats'); if (!el) return;
  el.textContent = editorStatsText(poolStats());
}
function editorStatsText(st) {
  return `${st.playable} songs ready · ${st.euro} Eurovision · ${st.history} history cards`;
}
function renderEditorPreviewButtons() {
  document.querySelectorAll('#edBody tr').forEach((tr) => {
    const b = tr.querySelector('[data-action="preview"]'); if (!b) return;
    const on = Audio.context === 'preview' && Audio.song && Audio.song.id === tr.dataset.id && (Audio.state === 'playing');
    b.classList.toggle('is-on', on);
    b.textContent = on ? '■ Stop' : '▶ Test';
  });
}
function onEditorInput(e) {
  const input = e.target; const f = input.dataset.f; if (!f) return;
  const tr = input.closest('tr'); const s = songs.find((x) => x.id === tr.dataset.id); if (!s) return;
  if (f === 'kind') { s.kind = input.value === 'history' ? 'history' : 'song'; saveSongs(true); renderEditor(); return; }
  if (input.type === 'checkbox') {
    s[f] = input.checked;
    if (f === 'use') tr.classList.toggle('is-off', !s.use);
    if (f === 'verified') tr.querySelector('.flag').innerHTML = s.verified ? '<span class="ok" title="Year verified">✓</span>' : '<span class="warn" title="Year not verified">⚠</span>';
  } else if (f === 'year') { const y = parseInt(input.value, 10); s.year = Number.isFinite(y) ? y : ''; }
  else if (f === 'start') { s.start = Math.max(0, parseInt(input.value, 10) || 0); }
  else if (f === 'yt' || f === 'alt') {
    const raw = input.value; const id = extractYouTubeId(raw);
    const note = tr.querySelector('.yt-note');
    if (f === 'yt') {
      if (raw.trim() === '') { s.yt = ''; input.classList.add('bad'); note.textContent = 'No video: skipped'; note.className = 'yt-note bad'; tr.querySelector('[data-action="preview"]').disabled = true; }
      else if (id) {
        s.yt = id; input.classList.remove('bad');
        const t = startFromUrl(raw);
        if (id !== raw.trim()) {
          input.value = id; note.textContent = 'ID taken from the link'; note.className = 'yt-note good';
          if (t != null) { s.start = t; tr.querySelector('[data-f="start"]').value = t; note.textContent = `ID and start time (${t}s) taken from the link`; }
        } else { note.textContent = ''; note.className = 'yt-note'; }
        tr.querySelector('[data-action="preview"]').disabled = false;
      } else { input.classList.add('bad'); note.textContent = 'Not a YouTube link or ID'; note.className = 'yt-note bad'; }
    } else {
      if (raw.trim() === '') s.alt = '';
      else if (id) { s.alt = id; if (id !== raw.trim()) input.value = id; input.classList.remove('bad'); }
      else input.classList.add('bad');
    }
  } else { s[f] = input.value; }
  saveSongs(); updateEditorStats();
}
function exportSongs() {
  const data = JSON.stringify({ app: 'israeli-hitster', version: 1, exported: new Date().toISOString(), songs }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `israeli-hitster-songs-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Song list exported. Check your Downloads folder.', 'good');
}
function importSongs(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let list;
    try { const data = JSON.parse(reader.result); list = Array.isArray(data) ? data : data.songs; } catch (e) { list = null; }
    if (!Array.isArray(list) || !list.length) { toast('That file is not an Israeli Hitster song list.', 'bad'); return; }
    const incoming = list.map(normalizeSong);
    modal({
      title: `Import ${incoming.length} songs?`,
      body: '<p><b>Replace</b> swaps your current list for the file. <b>Add</b> keeps your list and adds the songs from the file (songs with the same ID are updated).</p>',
      actions: [
        { label: 'Cancel' },
        { label: 'Add to my list', onClick: () => { incoming.forEach((s) => { const i = songs.findIndex((x) => x.id === s.id); if (i >= 0) songs[i] = s; else songs.push(s); }); saveSongs(true); renderEditor(); toast('Songs added.', 'good'); } },
        { label: 'Replace my list', kind: 'primary', onClick: () => { songs = incoming; saveSongs(true); renderEditor(); toast('Song list replaced.', 'good'); } }
      ]
    });
  };
  reader.readAsText(file);
}

/* =========================================================
   Modal, toast, keys help, fullscreen
   ========================================================= */
const modalRoot = $('#modalRoot');
let modalActions = [];
function modal({ title, body, actions }) {
  modalActions = actions || [{ label: 'OK', kind: 'primary' }];
  modalRoot.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><div class="body">${body || ''}</div><div class="m-actions">${modalActions.map((a, i) => `<button class="btn ${a.kind === 'primary' ? 'btn--primary' : ''}" data-modal="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
  modalRoot.classList.add('open');
  const primary = modalRoot.querySelector('.btn--primary') || modalRoot.querySelector('button');
  if (primary) primary.focus();
}
function closeModal() { modalRoot.classList.remove('open'); modalRoot.innerHTML = ''; modalActions = []; }
modalRoot.addEventListener('click', (e) => {
  const b = e.target.closest('[data-modal]');
  if (b) { const a = modalActions[+b.dataset.modal]; closeModal(); if (a && a.onClick) a.onClick(); return; }
  if (e.target === modalRoot) closeModal();
});
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function showKeys() {
  modal({
    title: 'Host keyboard shortcuts',
    body: `<div class="keys">
      <span class="kbd">Space</span><span>Play / pause the clip</span>
      <span class="kbd">R</span><span>Replay the clip from its start</span>
      <span class="kbd">T</span><span>Jump ahead 10 seconds (+10s)</span>
      <span class="kbd">1</span><span>…<span class="kbd">9</span> choose a gap on the timeline (← → also move it)</span>
      <span class="kbd">Enter</span><span>Reveal (lock in the chosen spot)</span>
      <span class="kbd">N</span><span>Next turn</span>
      <span class="kbd">F</span><span>Fullscreen on / off</span>
      <span class="kbd">?</span><span>Show this list</span>
    </div>`,
    actions: [{ label: 'Got it', kind: 'primary' }]
  });
}
function toggleFullscreen() {
  if (!document.fullscreenElement) { const p = document.documentElement.requestFullscreen?.(); if (p && p.catch) p.catch(() => toast('Fullscreen is not available here.', 'bad')); }
  else document.exitFullscreen?.();
}
let fileHelpShown = false;
function showFileProtocolHelp(code) {
  if (fileHelpShown || Audio.context !== 'game') return;
  fileHelpShown = true;
  modal({
    title: 'YouTube refused to play',
    body: `<p>YouTube sent error ${esc(code)}. This usually happens when the game is opened as a <b>local file</b>, because YouTube now asks every page that embeds a video to say which website it is on.</p>
      <p><b>Fix:</b> open the game from a web address instead of a file. For example, upload the HTML file to free hosting such as GitHub Pages or Netlify, or run a small local web server on your laptop. Then open that address in Chrome.</p>
      <p>The game skips clips that can't play, so it keeps working, but no music plays until this is fixed.</p>`,
    actions: [{ label: 'OK', kind: 'primary' }]
  });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  Sfx.ensure();
  const a = el.dataset.action;
  switch (a) {
    case 'keys': showKeys(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'songs':
      if (screen === 'songs') break;
      if (screen === 'game' && game && !game.over) {
        modal({
          title: 'Open the song list?',
          body: '<p>The song list shows <b>every title and artist</b>. If the projector is on, freeze or blank it first so the class does not see the answers.</p>',
          actions: [{ label: 'Cancel' }, { label: 'Open song list', kind: 'primary', onClick: () => { Audio.pause(); showScreen('songs'); } }]
        });
      } else showScreen('songs');
      break;
    case 'end-game': confirmEndGame(); break;
    case 'team-count': setupCfg.count = +el.dataset.n; saveSetup(); renderSetup(); break;
    case 'mode': setupCfg.mode = el.dataset.mode; saveSetup(); renderSetup(); break;
    case 'toggle-opt': setupCfg[el.dataset.opt] = !setupCfg[el.dataset.opt]; saveSetup(); renderSetup(); break;
    case 'start': newGame(); break;
    case 'resume': { const g = loadSavedGame(); if (g) { game = g; Audio.song = null; showScreen('game'); } break; }
    case 'play': doAudio('toggle'); break;
    case 'replay': doAudio('replay'); break;
    case 'forward': doAudio('forward'); break;
    case 'bet': toggleBet(); break;
    case 'exact-year': awardExactYear(); break;
    case 'steal-team': chooseStealer(+el.dataset.i); break;
    case 'word-claim': claimWord(+el.dataset.i); break;
    case 'gap': selectGap(+el.dataset.gap); break;
    case 'lock': lockIn(); break;
    case 'no-steal': noSteal(); break;
    case 'next': nextTurn(); break;
    case 'named': namedIt(); break;
    case 'hint': useHint(); break;
    case 'skip': useSkip(); break;
    case 'play-again': newGame(); break;
    case 'to-setup': game = null; showScreen('setup'); break;
    case 'editor-back': showScreen(returnScreen === 'songs' ? 'setup' : (returnScreen === 'game' && (!game || game.over) ? 'setup' : returnScreen)); break;
    case 'add-song':
    case 'add-history': {
      const s = normalizeSong({ year: '', title: '', use: true, kind: a === 'add-history' ? 'history' : 'song' });
      songs.unshift(s); saveSongs(true); editorFilter = ''; renderEditor();
      const first = document.querySelector(`#edBody tr[data-id="${s.id}"] [data-f="year"]`); if (first) first.focus();
      break;
    }
    case 'sort-songs': songs.sort((x, y) => (x.year || 9999) - (y.year || 9999)); saveSongs(true); renderEditor(); break;
    case 'export': exportSongs(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset-songs':
      modal({
        title: 'Reset to the built-in list?',
        body: '<p>This replaces your current song list with the original researched list. <b>Your edits and added songs will be lost</b> unless you export them first.</p>',
        actions: [{ label: 'Cancel' }, { label: 'Reset list', kind: 'primary', onClick: () => { songs = defaultSongs(); saveSongs(true); renderEditor(); toast('Built-in list restored.', 'good'); } }]
      });
      break;
    case 'del-song': {
      const id = el.closest('tr').dataset.id;
      if (pendingDelete.has(id)) { songs = songs.filter((s) => s.id !== id); pendingDelete.delete(id); saveSongs(true); el.closest('tr').remove(); updateEditorStats(); toast('Song deleted.'); }
      else { pendingDelete.add(id); el.outerHTML = '<button class="rowbtn rowbtn--confirm" data-action="del-song">Confirm delete</button>'; setTimeout(() => { if (pendingDelete.delete(id)) { const tr = document.querySelector(`#edBody tr[data-id="${id}"]`); const b = tr && tr.querySelector('[data-action="del-song"]'); if (b) b.outerHTML = '<button class="rowbtn rowbtn--del" data-action="del-song">Delete</button>'; } }, 4000); }
      break;
    }
    case 'preview': {
      const s = songs.find((x) => x.id === el.closest('tr').dataset.id); if (!s || !s.yt) break;
      if (Audio.context === 'preview' && Audio.song && Audio.song.id === s.id && Audio.state === 'playing') { Audio.stop(); }
      else { Audio.load(s, 'preview'); Audio.play(); }
      renderEditorPreviewButtons();
      break;
    }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.matches('[data-team]')) { setupCfg.names[+e.target.dataset.team] = e.target.value; saveSetup(); return; }
  if (e.target.id === 'edSearch') { editorFilter = e.target.value; applyEditorFilter(); return; }
  if (screen === 'songs' && e.target.closest('#edBody')) onEditorInput(e);
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'importFile' && e.target.files[0]) { importSongs(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (modalRoot.classList.contains('open')) closeModal(); return; }
  const tag = e.target.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable;
  if (typing) return;
  if (modalRoot.classList.contains('open')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'f') { toggleFullscreen(); return; }
  if (k === '?') { showKeys(); return; }
  if (screen === 'win' && k === 'n') return;
  if (screen !== 'game' || !game || !game.turn) return;
  const t = game.turn;
  if (k === ' ' || k === 'Spacebar') { e.preventDefault(); Sfx.ensure(); doAudio('toggle'); return; }
  if (k === 'r') { doAudio('replay'); return; }
  if (k === 't') { doAudio('forward'); return; }
  if (k === 'Enter') { e.preventDefault(); if (t.phase === 'listen' || t.phase === 'steal') lockIn(); return; }
  if (k === 'n') { if (t.phase === 'reveal') nextTurn(); return; }
  if (/^[1-9]$/.test(k) && (t.phase === 'listen' || t.phase === 'steal')) { selectGap(+k - 1); return; }
  if ((k === 'ArrowLeft' || k === 'ArrowRight') && (t.phase === 'listen' || t.phase === 'steal')) {
    e.preventDefault();
    if (t.phase === 'steal' && t.stealIdx == null) return;
    const team = game.teams[t.phase === 'steal' ? t.stealIdx : game.turnIdx];
    const max = team.cards.length;
    let g = t.gap == null ? (k === 'ArrowLeft' ? max : 0) : t.gap + (k === 'ArrowLeft' ? -1 : 1);
    g = Math.max(0, Math.min(max, g));
    t.gap = g; saveGame(); renderTimelineOnly(); renderActions();
  }
});

/* =========================================================
   Confetti (win screen)
   ========================================================= */
const Confetti = {
  canvas: $('#confetti'), raf: 0,
  burst(colors) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = this.canvas; const ctx = c.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const palette = colors.concat(['#ffd166', '#ffffff', '#4ea8ff']);
    const parts = Array.from({ length: 220 }, () => ({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
      vx: (Math.random() - 0.5) * 2.2, vy: 2 + Math.random() * 3.5, r: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25, col: palette[Math.floor(Math.random() * palette.length)]
    }));
    const startT = performance.now();
    cancelAnimationFrame(this.raf);
    const step = (now) => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vx += Math.sin((now + p.r * 100) / 400) * 0.03;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      });
      if (now - startT < 7000) this.raf = requestAnimationFrame(step);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    this.raf = requestAnimationFrame(step);
  }
};

/* =========================================================
   Debug hook for automated tests (harmless in class)
   ========================================================= */
window.hitsterDebug = {
  get game() { return game; }, get songs() { return songs; }, get screen() { return screen; }, Audio, force: forceNext,
  correctGap: (teamIdx) => correctGapFor(teamIdx)
};

render();
</script>
